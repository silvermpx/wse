[package]
name = "wse-bench"
version = "0.2.0"
edition = "2021"
description = "WSE server stress-test and benchmark suite"

[[bin]]
name = "wse-bench"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
clap = { version = "4.6.7", features = ["derive"] }
hmac = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
hdrhistogram = "7.6.0"
chrono = "0.4.45"
flate2 = "1.1.11"
rmp-serde = "1.3.1"
rand = "0.10.3"
http = "1.5.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
aes-gcm = "0.11.1"
hkdf = "0.13.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
