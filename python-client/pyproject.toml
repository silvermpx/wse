[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wse-client"
# Single source of truth: wse_client/_version.py (also used as CLIENT_VERSION
# in the handshake), read by hatchling below.
dynamic = ["version"]
description = "Python client for WSE (WebSocket Engine) -- real-time event streaming"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "silvermpx" }]
keywords = ["websocket", "real-time", "event-streaming", "wse"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=13.0",
]

[project.optional-dependencies]
crypto = ["cryptography>=43.0"]
msgpack = ["msgpack>=1.0"]
orjson = ["orjson>=3.10"]
all = [
    "cryptography>=43.0",
    "msgpack>=1.0",
    "orjson>=3.10",
]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
]

[project.urls]
Homepage = "https://github.com/silvermpx/wse"
Documentation = "https://github.com/silvermpx/wse/tree/main/python-client"
Repository = "https://github.com/silvermpx/wse"
Issues = "https://github.com/silvermpx/wse/issues"

[tool.hatch.version]
path = "wse_client/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["wse_client"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Ruff 0.17 also formats Python blocks inside Markdown; the README's examples
# keep their hand-aligned comments.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Ruff 0.17 widened its default rule set (blind excepts, try-except-pass, ...).
# Keep the rules this client is written against; adopting the new ones means
# changing its error handling, which is a change of its own.
select = ["E4", "E7", "E9", "F"]
