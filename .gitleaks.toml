# gitleaks: secret scan of every pushed commit range (ci.yml) and of the
# whole history once a week (weekly.yml). The default rules apply; the
# exceptions below are narrow, so a real secret anywhere else still fails.

title = "WSE"

[extend]
useDefault = true

[[allowlists]]
description = "Key pairs that exist only for the JWT tests"
paths = ['''^tests/keys/[a-z0-9]+_private\.pem$''']

[[allowlists]]
description = "Test vectors: keys derived from fixed inputs, generated by tests/vectors/make_*_vectors.py"
paths = ['''^tests/vectors/(e2e|sign)\.json$''']

[[allowlists]]
description = "Example JWT claims in the documentation"
regexTarget = "line"
regexes = ['''jwt_(?:issuer|audience)="[a-z-]+"''']
