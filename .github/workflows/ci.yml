name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # The maturin that builds the extension here. Keep it equal to
  # MATURIN_VERSION in release.yml and inside pyproject.toml's
  # [build-system] requires.
  MATURIN_VERSION: '1.16.0'

jobs:
  # ---------------------------------------------------------------------------
  # What changed: a docs-only change skips the builds. ci-ok below is the one
  # result to require; it counts a skipped job as passed.
  # ---------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      server: ${{ steps.filter.outputs.server }}
      python_client: ${{ steps.filter.outputs.python_client }}
      ts_client: ${{ steps.filter.outputs.ts_client }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
    steps:
      # Credentials stay: on a push the filter fetches the previous commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'rust/**'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            server:
              - 'rust/**'
              - 'wse_server/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            python_client:
              - 'python-client/**'
              - '.github/workflows/ci.yml'
            ts_client:
              - 'ts-client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - '.github/scripts/npm-consumer-check.sh'
              - '.github/workflows/ci.yml'
            benchmarks:
              - 'benchmarks/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Repository checks (cargo xtask): comments, engine boundary, commit messages
  # ---------------------------------------------------------------------------
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the commit message check reads the pushed range
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "xtask -> target"

      - name: xtask (fmt, clippy, tests)
        working-directory: xtask
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Comments and engine boundary
        run: cargo xtask lint

      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          cargo xtask commits "$range"

  # ---------------------------------------------------------------------------
  # Secrets: gitleaks over the pushed commits (the full history weekly)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the pushed commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range=""  # a new branch or a rewritten one: the whole history
          fi
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            ${range:+--log-opts="$range"} .

  # ---------------------------------------------------------------------------
  # TS client: type-check, unit tests, build, consumer check
  # ---------------------------------------------------------------------------
  client:
    name: Client (TS)
    needs: changes
    if: needs.changes.outputs.ts_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      # The packed tarball, installed into a fresh project: bundled with
      # esbuild and imported in Node, the two ways applications load it.
      - name: Consumer check
        run: |
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist
          bash .github/scripts/npm-consumer-check.sh npm-dist/wse-client-*.tgz

  # ---------------------------------------------------------------------------
  # Python client: lint + tests
  # ---------------------------------------------------------------------------
  python-client:
    name: Python Client (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python_client == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install
        run: |
          pip install 'ruff==0.17.5'
          pip install -e "python-client[all,dev]"

      - name: Ruff check
        run: ruff check python-client/

      - name: Ruff format
        run: ruff format --check python-client/

      - name: Run tests
        run: pytest python-client/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Python server: lint + type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # prometheus-client: wse_server.prometheus imports it (the prometheus extra).
      - run: pip install 'ruff==0.17.5' 'mypy==2.4.1' prometheus-client

      - name: Ruff check
        run: ruff check wse_server/ tests/

      - name: Ruff format
        run: ruff format --check wse_server/ tests/

      # Strict mypy (pyproject.toml [tool.mypy]) over the package and the
      # shipped stub of the extension.
      - name: Mypy
        run: mypy wse_server

  # ---------------------------------------------------------------------------
  # Rust: fmt + clippy
  # ---------------------------------------------------------------------------
  rust-lint:
    name: Rust Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "rust -> target"

      - name: Format check
        run: cargo fmt --manifest-path rust/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Rust: unit tests
  # ---------------------------------------------------------------------------
  rust-test:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Without pyo3's extension-module feature the test binary links
      # libpython. setup-python's CPython is a shared build and exports
      # LD_LIBRARY_PATH to its lib directory, so the binary also runs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "rust -> target"

      - name: cargo test
        run: cargo test --manifest-path rust/Cargo.toml --locked
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # ---------------------------------------------------------------------------
  # Rust: the declared minimum version (rust-version in rust/Cargo.toml),
  # which is what an sdist install needs at least
  # ---------------------------------------------------------------------------
  rust-msrv:
    name: Rust MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' rust/Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error file=rust/Cargo.toml::no rust-version found"
            exit 1
          fi
          echo "Declared MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "rust -> target"

      - name: cargo check (MSRV)
        run: cargo +"$MSRV" check --manifest-path rust/Cargo.toml --locked
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # ---------------------------------------------------------------------------
  # Python server: build Rust + run tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t / 3.15t: free-threaded builds (no GIL).
        python: ['3.12', '3.13', '3.14', '3.15', '3.14t', '3.15t']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "rust -> target"

      # cryptography plays the client side of the E2E key exchange test;
      # prometheus-client runs the collector test (wse-server[prometheus]).
      - name: Create virtualenv + install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin==${MATURIN_VERSION}" pytest pytest-asyncio pytest-cov httpx websockets cryptography prometheus-client

      - name: Build Rust extension
        run: |
          source .venv/bin/activate
          maturin develop --release --locked

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Benchmarks: the tools behind the published numbers must still build
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks (build)
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "benchmarks/rust-bench -> target"

      - name: rust-bench (cargo check)
        run: cargo check --manifest-path benchmarks/rust-bench/Cargo.toml --locked --all-targets

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: benchmarks/ts-bench/package-lock.json

      - name: ts-bench (type check)
        working-directory: benchmarks/ts-bench
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit -p .

      - name: Python benchmark scripts (syntax)
        run: python3 -m compileall -q benchmarks/

  # ---------------------------------------------------------------------------
  # Security: dependency audit (every step can fail the job)
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny (deny.toml): advisories, yanked crates, licenses, sources
      # and wildcard versions, for the extension, xtask and the benchmarks.
      - name: Rust dependencies (extension)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: rust/Cargo.toml
          command: check

      - name: Rust dependencies (xtask)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: xtask/Cargo.toml
          command: check

      - name: Rust dependencies (benchmarks)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: benchmarks/rust-bench/Cargo.toml
          command: check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # The npm package's runtime dependencies (what users install). Dev
      # tooling advisories do not reach users and do not fail the build.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # wse-server has no Python runtime dependencies; wse-client[all] has
      # websockets, cryptography, msgpack and orjson. Resolve them as a user
      # would today and audit exactly that set.
      - name: pip-audit (Python client dependencies)
        run: |
          python -m venv /tmp/client-env
          /tmp/client-env/bin/pip install --quiet "./python-client[all]"
          /tmp/client-env/bin/pip freeze --exclude wse-client > /tmp/client-requirements.txt
          cat /tmp/client-requirements.txt
          python -m pip install --quiet 'pip-audit==2.10.1'
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r /tmp/client-requirements.txt

  # ---------------------------------------------------------------------------
  # The one result to require for merging: every job passed or was skipped
  # because nothing it covers changed.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, secrets, client, python-client, lint, rust-lint, rust-test, rust-msrv, test, benchmarks, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          results = {name: job["result"] for name, job in json.load(sys.stdin).items()}
          print(json.dumps(results, indent=2))
          bad = [name for name, result in results.items() if result not in ("success", "skipped")]
          if bad:
              sys.exit("failed or cancelled: " + ", ".join(bad))'
