name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  # The maturin that builds the extension here. Keep it equal to
  # MATURIN_VERSION in release.yml and inside pyproject.toml's
  # [build-system] requires.
  MATURIN_VERSION: '1.16.0'

jobs:
  # ---------------------------------------------------------------------------
  # What changed: a docs-only change skips the builds. ci-ok below is the one
  # result to require; it counts a skipped job as passed.
  # ---------------------------------------------------------------------------
  changes:
    name: Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      server: ${{ steps.filter.outputs.server }}
      python_client: ${{ steps.filter.outputs.python_client }}
      ts_client: ${{ steps.filter.outputs.ts_client }}
      mobile: ${{ steps.filter.outputs.mobile }}
      benchmarks: ${{ steps.filter.outputs.benchmarks }}
      conformance: ${{ steps.filter.outputs.conformance }}
      electron: ${{ steps.filter.outputs.electron }}
      tauri: ${{ steps.filter.outputs.tauri }}
    steps:
      # Credentials stay: on a push the filter fetches the previous commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'bindings/dart/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'deny.toml'
              - '.github/workflows/ci.yml'
            server:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'wse_server/**'
              - 'tests/**'
              - 'pyproject.toml'
              - '.github/workflows/ci.yml'
            python_client:
              - 'python-client/**'
              - 'crates/*/tests/vectors/**'
              - '.github/workflows/ci.yml'
            ts_client:
              - 'ts-client/**'
              - 'crates/*/tests/vectors/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'vitest.config.ts'
              - '.github/scripts/npm-consumer-check.sh'
              - '.github/scripts/rn-bundle-check.sh'
              - '.github/scripts/rn-app-check.sh'
              - '.github/scripts/framework-consumer-check.sh'
              - 'tests/clients/**'
              - '.github/workflows/ci.yml'
            mobile:
              - 'crates/wse/**'
              - 'crates/wse-client/**'
              - 'crates/wse-ffi/**'
              - 'crates/wse-bindgen/**'
              - 'crates/wse-conformance/**'
              - 'tests/conformance/**'
              - 'bindings/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/scripts/maven-central.sh'
              - '.github/workflows/ci.yml'
            benchmarks:
              - 'benchmarks/**'
              - '.github/workflows/ci.yml'
            conformance:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'ts-client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'python-client/**'
              - 'tests/conformance/**'
              - '.github/workflows/ci.yml'
            electron:
              - 'crates/wse/**'
              - 'crates/wse-conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'ts-client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'bindings/electron/**'
              - 'bindings/example-ui/**'
              - 'tests/clients/electron/**'
              - '.github/scripts/electron-consumer-check.sh'
              - 'crates/wse-client/examples/**'
              - 'tests/conformance/**'
              - '.github/workflows/ci.yml'
            tauri:
              - 'crates/wse/**'
              - 'crates/wse-client/**'
              - 'crates/wse-conformance/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'ts-client/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.json'
              - 'bindings/tauri/**'
              - 'bindings/example-ui/**'
              - 'tests/clients/tauri/**'
              - '.github/scripts/tauri-consumer-check.sh'
              - 'tests/conformance/**'
              - '.github/workflows/ci.yml'

  # ---------------------------------------------------------------------------
  # Repository checks (cargo xtask): comments, engine boundary, commit messages
  # ---------------------------------------------------------------------------
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the commit message check reads the pushed range
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "xtask -> target"

      - name: xtask (fmt, clippy, tests)
        working-directory: xtask
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: Comments and engine boundary
        run: cargo xtask lint

      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="$AFTER~1..$AFTER"
          fi
          cargo xtask commits "$range"

  # ---------------------------------------------------------------------------
  # Secrets: gitleaks over the pushed commits (the full history weekly)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan the pushed commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range=""  # a new branch or a rewritten one: the whole history
          fi
          gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 \
            ${range:+--log-opts="$range"} .

  # ---------------------------------------------------------------------------
  # TS client: type-check, unit tests, build, consumer check
  # ---------------------------------------------------------------------------
  client:
    name: Client (TS)
    needs: changes
    if: needs.changes.outputs.ts_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      # The packed tarball, installed into a fresh project: bundled with
      # esbuild and imported in Node, the two ways applications load it.
      - name: Consumer check
        run: |
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist
          bash .github/scripts/npm-consumer-check.sh npm-dist/wse-client-*.tgz
          bash .github/scripts/rn-bundle-check.sh npm-dist/wse-client-*.tgz

  # ---------------------------------------------------------------------------
  # The TypeScript client against the server of this checkout: JWT cookies, an
  # E2E session with the server's own code, recovery after a kick, a stop and
  # a restart. Required: a missing prerequisite fails, it never skips.
  # ---------------------------------------------------------------------------
  # The Angular and Solid adapters in applications as each framework's
  # tooling makes them, built against the packed client: a production build,
  # server rendering, hydration in Chromium, one connection, German and
  # English (framework-consumer-check.sh).
  frameworks:
    name: Framework application (${{ matrix.fixture }})
    needs: changes
    if: needs.changes.outputs.ts_client == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fixture: [angular20, angular21, angular22, solid1, solid2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: frameworks

      - name: The packed client
        run: |
          npm ci --ignore-scripts
          npm run build
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist

      - name: Chromium, and what it needs here
        run: |
          cd tests/clients/harness
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: The application
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: bash .github/scripts/framework-consumer-check.sh npm-dist/wse-client-*.tgz "$FIXTURE"

  client-server:
    name: Client (TS) against the server
    needs: changes
    if: needs.changes.outputs.server == 'true' || needs.changes.outputs.ts_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      # cryptography: the test server's E2E identity key.
      - name: Build the server
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin==${MATURIN_VERSION}" cryptography
          maturin develop --release --locked

      - name: Install
        run: npm ci --ignore-scripts

      - name: The client against the server
        env:
          WSE_E2E_PYTHON: ${{ github.workspace }}/.venv/bin/python
          WSE_E2E_REQUIRED: '1'
        run: npx vitest run ts-client/__tests__/realServer.test.ts

  # ---------------------------------------------------------------------------
  # Python client: lint + tests
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Every client against the conformance server, and the check of the reports
  # ---------------------------------------------------------------------------
  conformance:
    name: Conformance (TypeScript, Rust, Python)
    needs: changes
    if: needs.changes.outputs.conformance == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: conformance

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install
        run: |
          npm ci --ignore-scripts
          pip install -e "python-client[all,dev]"

      - name: The clients, each case on a server of its own
        run: |
          cargo build --locked -p wse-conformance
          out="$RUNNER_TEMP/conformance"
          target/debug/wse-conformance serve --out "$out" > serve.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '"ready"' serve.log && break; sleep 0.1; done
          WSE_CONFORMANCE="$(sed -n 's/.*"control":"\([^"]*\)".*/\1/p' serve.log)"
          export WSE_CONFORMANCE WSE_CONFORMANCE_REQUIRED=1
          npx vitest run --project client ts-client/__tests__/conformance.test.ts
          WSE_CONFORMANCE_BRIDGE=1 npx vitest run --project client ts-client/__tests__/conformance.test.ts
          WSE_CONFORMANCE_BRIDGE=rust npx vitest run --project client ts-client/__tests__/conformance.test.ts
          cargo test --locked -p wse-client --test conformance
          pytest python-client/tests/test_conformance.py -q
          target/debug/wse-conformance check --manifest tests/conformance/agents.json --reports "$out"

      - name: The reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: conformance-reports
          path: ${{ runner.temp }}/conformance
          if-no-files-found: ignore

  # The Electron package in a real Electron, on each system: every
  # conformance case with its client in a window's page and the owner in
  # the main process.
  electron:
    name: Electron (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.electron == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: electron

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Install
        run: |
          npm ci --ignore-scripts
          cd bindings/electron
          npm ci --no-audit --no-fund
          npx install-electron

      # Ubuntu keeps unprivileged user namespaces from applications without
      # an AppArmor profile: Electron's sandbox needs them.
      - name: Electron's sandbox on Ubuntu
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Every case in a real Electron window
        run: |
          npx tsc -p bindings/electron/tsconfig.json
          node bindings/electron/conformance/build.mjs
          cargo build --locked -p wse-conformance
          out="$RUNNER_TEMP/electron"
          mkdir -p "$out"
          target/debug/wse-conformance serve --out "$out" > serve.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '"ready"' serve.log && break; sleep 0.1; done
          control="$(sed -n 's/.*"control":"\([^"]*\)".*/\1/p' serve.log)"
          display=
          if [ "$RUNNER_OS" = Linux ]; then display='xvfb-run -a'; fi
          $display bindings/electron/node_modules/.bin/electron bindings/electron/conformance/out/main.mjs "$control"
          target/debug/wse-conformance check --manifest tests/conformance/electron.json --reports "$out"

      - name: The example application, against the example server
        run: |
          node bindings/electron/example/build.mjs
          cargo build --locked -p wse-client --example server
          WSE_PORT=5917 target/debug/examples/server > example-server.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '^signing_public_key' example-server.log && break; sleep 0.1; done
          display=
          if [ "$RUNNER_OS" = Linux ]; then display='xvfb-run -a'; fi
          WSE_URL=ws://127.0.0.1:5917/wse WSE_EXAMPLE_CHECK=1 $display bindings/electron/node_modules/.bin/electron bindings/electron/example/out/main.mjs

      - name: The packed package in an Electron application
        run: |
          npm run build
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist
          bash .github/scripts/electron-consumer-check.sh npm-dist/wse-client-*.tgz

      - name: The reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: electron-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/electron
          if-no-files-found: ignore

  # Tauri's plugin (bindings/tauri, a workspace of its own) on each system:
  # its lints and tests, then every conformance case in a real Tauri
  # webview, its client a page's and the owner on the Rust side.
  tauri:
    name: Tauri (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tauri == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: |
            . -> target
            bindings/tauri -> target
          key: tauri

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # Tauri builds against WebKitGTK on Linux; Ubuntu keeps unprivileged
      # user namespaces from applications without an AppArmor profile, and
      # WebKitGTK's sandbox needs them.
      - name: The webview's libraries on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev librsvg2-dev xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install
        run: npm ci --ignore-scripts

      - name: The pages
        run: |
          npx tsc -p bindings/tauri/tsconfig.json
          node bindings/tauri/conformance/build.mjs
          node bindings/tauri/example/build.mjs

      - name: The plugin's lints and tests
        working-directory: bindings/tauri
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked -p tauri-plugin-wse

      - name: Every case in a real Tauri webview
        env:
          # Software rendering in a virtual display.
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          (cd bindings/tauri && cargo build --locked -p wse-tauri-conformance -p wse-tauri-example)
          cargo build --locked -p wse-conformance
          out="$RUNNER_TEMP/tauri"
          mkdir -p "$out"
          target/debug/wse-conformance serve --out "$out" > serve.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '"ready"' serve.log && break; sleep 0.1; done
          control="$(sed -n 's/.*"control":"\([^"]*\)".*/\1/p' serve.log)"
          display=
          if [ "$RUNNER_OS" = Linux ]; then display='xvfb-run -a'; fi
          $display bindings/tauri/target/debug/wse-tauri-conformance "$control"
          target/debug/wse-conformance check --manifest tests/conformance/tauri.json --reports "$out"

      - name: The example application, against the example server
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          cargo build --locked -p wse-client --example server
          WSE_PORT=5918 target/debug/examples/server > example-server.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '^signing_public_key' example-server.log && break; sleep 0.1; done
          display=
          if [ "$RUNNER_OS" = Linux ]; then display='xvfb-run -a'; fi
          WSE_URL=ws://127.0.0.1:5918/wse WSE_EXAMPLE_CHECK=1 $display bindings/tauri/target/debug/wse-tauri-example

      # The npm package as an application installs it, and the crates as
      # crates.io will give them (packaged here, nothing of the sources).
      - name: The packed packages in a Tauri application
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          npm run build
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist
          cargo package --locked --no-verify -p wse -p wse-client
          (cd bindings/tauri && cargo package --locked --no-verify -p tauri-plugin-wse \
            --config 'patch.crates-io.wse-client.path="../../crates/wse-client"' \
            --config 'patch.crates-io.wse.path="../../crates/wse"')
          mkdir -p crates
          cp target/package/wse-*.crate bindings/tauri/target/package/tauri-plugin-wse-*.crate crates/
          bash .github/scripts/tauri-consumer-check.sh npm-dist/wse-client-*.tgz crates

      - name: The reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: tauri-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/tauri
          if-no-files-found: ignore

  python-client:
    name: Python Client (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.python_client == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - name: Install
        run: |
          pip install 'ruff==0.17.5'
          pip install -e "python-client[all,dev]"

      - name: Ruff check
        run: ruff check python-client/

      - name: Ruff format
        run: ruff format --check python-client/

      - name: Run tests
        run: pytest python-client/tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Python server: lint + type-check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      # prometheus-client: wse_server.prometheus imports it (the prometheus extra).
      - run: pip install 'ruff==0.17.5' 'mypy==2.4.1' prometheus-client

      - name: Ruff check
        run: ruff check wse_server/ tests/

      - name: Ruff format
        run: ruff format --check wse_server/ tests/

      # Strict mypy (pyproject.toml [tool.mypy]) over the package and the
      # shipped stub of the extension.
      - name: Mypy
        run: mypy wse_server

  # ---------------------------------------------------------------------------
  # Rust: fmt + clippy
  # ---------------------------------------------------------------------------
  rust-lint:
    name: Rust Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"

      - name: Format check
        run: cargo fmt --all -- --check

      # The engine alone (what crates.io has), with the Python module, and
      # the client without its crypto (ws:// only).
      - name: Clippy
        run: |
          cargo clippy -p wse --locked --all-targets -- -D warnings
          cargo clippy -p wse --locked --no-default-features --all-targets -- -D warnings
          cargo clippy --workspace --locked --all-targets -- -D warnings
          cargo clippy -p wse-client --locked --no-default-features --all-targets -- -D warnings

  # ---------------------------------------------------------------------------
  # Rust: unit tests
  # ---------------------------------------------------------------------------
  rust-test:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Without pyo3's extension-module feature the test binary links
      # libpython. setup-python's CPython is a shared build and exports
      # LD_LIBRARY_PATH to its lib directory, so the binary also runs.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"

      - name: cargo test
        run: |
          cargo test -p wse --locked
          cargo test -p wse --locked --features python
          cargo test -p wse --locked --no-default-features
          cargo test -p wse-client --locked
          cargo test -p wse-client --locked --features native
          cargo test -p wse-client --locked --features bridge --test bridge
          cargo test -p wse-client --locked --no-default-features
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # ---------------------------------------------------------------------------
  # Rust: the client in the browser (wasm32), run in Node against the
  # `server` example; and its pure-Rust crypto natively, against the
  # server's tests and the shared vectors.
  # ---------------------------------------------------------------------------
  rust-wasm:
    name: Rust client (browser)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: wasm

      # Node 22 has the WebSocket the browser has; IndexedDB comes from
      # fake-indexeddb, a development dependency of the repository.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Node modules (fake-indexeddb for the outbox's tests)
        run: npm ci --ignore-scripts

      - name: wasm-bindgen test runner (the version in Cargo.lock)
        run: |
          version="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
          if [ "$(wasm-bindgen-test-runner --version 2>/dev/null)" != "wasm-bindgen-test-runner ${version}" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked
          fi

      - name: Clippy (wasm32)
        run: |
          cargo clippy -p wse --locked --target wasm32-unknown-unknown --no-default-features --all-targets -- -D warnings
          cargo clippy -p wse-client --locked --target wasm32-unknown-unknown --all-targets -- -D warnings
          cargo clippy -p wse-client --locked --target wasm32-unknown-unknown --no-default-features --all-targets -- -D warnings

      - name: The browser client against a server
        run: |
          cargo build -p wse-client --locked --example server
          WSE_PORT=5017 target/debug/examples/server > server.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '^signing_public_key ' server.log && break; sleep 0.1; done
          cat server.log
          WSE_TEST_URL="$(sed -n 's/^url //p' server.log)" \
          WSE_TEST_IDENTITY="$(sed -n 's/^e2e_identity_public_key //p' server.log)" \
          WSE_TEST_SIGNING="$(sed -n 's/^signing_public_key //p' server.log)" \
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
            cargo test -p wse-client --locked --target wasm32-unknown-unknown --lib --test browser

      - name: The conformance cases, through the browser's client
        run: |
          cargo build -p wse-conformance --locked
          out="$RUNNER_TEMP/rust-browser"
          mkdir -p "$out"
          target/debug/wse-conformance serve --out "$out" > conformance.log 2>&1 &
          for _ in $(seq 1 100); do grep -q '"ready"' conformance.log && break; sleep 0.1; done
          WSE_CONFORMANCE="$(sed -n 's/.*"control":"\([^"]*\)".*/\1/p' conformance.log)" WSE_CONFORMANCE_REQUIRED=1 \
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner \
            cargo test -p wse-client --locked --target wasm32-unknown-unknown --test conformance_browser
          target/debug/wse-conformance check --manifest tests/conformance/rust-browser.json --reports "$out"

      - name: The pure-Rust crypto, natively
        env:
          RUSTFLAGS: --cfg wse_rustcrypto
          CARGO_TARGET_DIR: target/rustcrypto
        run: |
          cargo test -p wse --locked --no-default-features --lib
          cargo test -p wse-client --locked --lib --tests

  # ---------------------------------------------------------------------------
  # Rust: the `fips` build (aws-lc-rs from its FIPS 140-3 module), so the
  # option keeps compiling and its tests keep passing. It needs CMake and Go,
  # both on the runner image.
  # ---------------------------------------------------------------------------
  rust-fips:
    name: Rust Tests (FIPS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: fips

      - name: cargo test --features fips
        run: |
          cargo test -p wse --locked --features fips,python
          cargo test -p wse-client --locked --features fips
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Clippy (fips)
        run: |
          cargo clippy -p wse --locked --features fips,python --all-targets -- -D warnings
          cargo clippy -p wse-client --locked --features fips --all-targets -- -D warnings
        env:
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # ---------------------------------------------------------------------------
  # Rust: the declared minimum version (rust-version in Cargo.toml),
  # which is what an sdist install needs at least
  # ---------------------------------------------------------------------------
  rust-msrv:
    name: Rust MSRV
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read rust-version
        id: msrv
        run: |
          msrv="$(sed -n 's/^rust-version *= *"\([0-9.]*\)".*/\1/p' Cargo.toml)"
          if [ -z "$msrv" ]; then
            echo "::error file=Cargo.toml::no rust-version found"
            exit 1
          fi
          echo "Declared MSRV: $msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        id: python
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"

      - name: cargo check (MSRV)
        run: |
          cargo +"$MSRV" check --workspace --locked
          cargo +"$MSRV" check -p wse-client --locked --target wasm32-unknown-unknown
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
          PYO3_PYTHON: ${{ steps.python.outputs.python-path }}

  # ---------------------------------------------------------------------------
  # Mobile: the native module for Swift (macOS and an iOS simulator), Kotlin
  # (JVM, and Android in an emulator) and Dart/Flutter (host tests, the
  # example app on an iOS simulator and in the emulator). The committed
  # bindings must equal what the generators make from this checkout. The
  # Dart package's build hook builds with the Rust its rust-toolchain.toml
  # names; the jobs that run it install that one.
  # ---------------------------------------------------------------------------
  swift:
    name: Swift (macOS, iOS simulator)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 60  # a simulator or an emulator can hang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: swift

      - name: Build, then the tests on the Mac and on an iOS simulator
        env:
          PROFILE: debug
          SIMULATOR: '1'
        run: bindings/swift/run-tests.sh

      - name: The committed bindings are the generated ones
        run: git diff --exit-code -- bindings/swift/Sources

  # The Kotlin tests on the JVM, then the JVM package the way an application
  # gets it (run-jvm-consumer-check.sh): made with this runner's library,
  # installed from a Maven repository and run on Java 17; on Linux in
  # Alpine's Java image (musl) too, with the musl library built in the
  # container the release builds it in.
  kotlin:
    name: Kotlin (JVM, ${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-24.04
            alpine: '1'
          - name: macOS
            runner: macos-latest
          - name: Windows
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: kotlin-${{ matrix.name }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: '9.9.1'

      # Windows: aws-lc's assembly from the objects it ships, without NASM.
      - name: Build and test
        env:
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: bindings/kotlin/run-tests.sh

      - name: The committed bindings are the generated ones
        run: git diff --exit-code -- bindings/kotlin/generated

      - name: The JVM package as an application gets it
        env:
          ALPINE: ${{ matrix.alpine }}
          MUSL_IMAGE: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:3f1010eb48311dfde5d51f011163451940af34bd317355c4a8652ce6b4b61051
          ALPINE_JAVA_IMAGE: eclipse-temurin:21-jre-alpine@sha256:ac05c3c42b7c2f1a52c9bd52f01041fa1958231b15ebeae7420429cbc5baf474
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: bindings/kotlin/run-jvm-consumer-check.sh

  android:
    name: Android (emulator)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a simulator or an emulator can hang
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The Rust the Dart package pins
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' bindings/dart/rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target x86_64-linux-android
          rustup default "$channel"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: android

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: '9.9.1'

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-ndk@4.1.2

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable

      # The newest NDK on the runner links for 16 KB pages. The consumer
      # check builds an app on the release AAR with R8 on; the Flutter
      # example runs as a test, then as a release build.
      - name: Kotlin, an app built with R8, then the Flutter example, in an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_SERIAL=emulator-5554 bindings/kotlin/android/run-emulator-tests.sh
            ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" ANDROID_SERIAL=emulator-5554 bindings/kotlin/android/run-consumer-check.sh
            bindings/dart/example/run-integration-tests.sh emulator-5554
            MODE=release bindings/dart/example/run-integration-tests.sh emulator-5554

  # React Native: the packed npm package in an app made from React Native's
  # template, built for release (Hermes bytecode) and run on an emulator
  # against the Rust client's example server.
  react-native:
    name: React Native app (emulator)
    needs: changes
    if: needs.changes.outputs.ts_client == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a simulator or an emulator can hang
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: react-native

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - name: The npm package
        run: |
          npm ci
          npm run build
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist

      - name: The app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash .github/scripts/rn-app-check.sh npm-dist/wse-client-*.tgz emulator-5554

  dart:
    name: Dart (Flutter ${{ matrix.flutter }})
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a desktop app can hang
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter the package supports, and the newest.
        flutter: ['3.38.10', '3.50.0']
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: The Rust the Dart package pins
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' bindings/dart/rust/rust-toolchain.toml)"
          # The bindings' generator formats its Rust with rustfmt.
          rustup toolchain install "$channel" --profile minimal --component rustfmt
          rustup default "$channel"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: dart

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-expand@1.0.127,flutter_rust_bridge_codegen@2.13.0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable

      - name: Generate the bindings, then the tests
        run: bindings/dart/run-tests.sh

      # A Flutter app on Linux is a GTK app: its build tools, and a display.
      - name: Linux desktop tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - name: The example as a Linux app, then its release build run
        run: |
          xvfb-run -a bindings/dart/example/run-integration-tests.sh linux
          MODE=release xvfb-run -a bindings/dart/example/run-integration-tests.sh linux

      - name: The committed bindings are the generated ones
        if: matrix.flutter == '3.50.0'
        run: git diff --exit-code -- bindings/dart/lib/src/rust bindings/dart/rust/src

  flutter-ios:
    name: Flutter (iOS simulator)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: macos-latest
    timeout-minutes: 60  # a simulator or an emulator can hang
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: The Rust the Dart package pins
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' bindings/dart/rust/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target aarch64-apple-ios-sim,aarch64-apple-ios
          rustup default "$channel"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: flutter-ios

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable

      # A simulator runs debug builds only: the release build is made for a device.
      - name: The example app on an iOS simulator, then built in release mode
        run: |
          device="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bindings/dart/example/run-integration-tests.sh "$device"
          MODE=release bindings/dart/example/run-integration-tests.sh "$device"

  # ---------------------------------------------------------------------------
  # Python server: build Rust + run tests
  # ---------------------------------------------------------------------------
  test:
    name: Test (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14t / 3.15t: free-threaded builds (no GIL).
        python: ['3.12', '3.13', '3.14', '3.15', '3.14t', '3.15t']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"

      # cryptography plays the client side of the E2E key exchange test;
      # prometheus-client runs the collector test (wse-server[prometheus]).
      - name: Create virtualenv + install deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install "maturin==${MATURIN_VERSION}" pytest pytest-asyncio pytest-cov httpx websockets cryptography prometheus-client
          # tests/test_clients.py runs the Python client against the server.
          pip install -e python-client

      - name: Build Rust extension
        run: |
          source .venv/bin/activate
          maturin develop --release --locked

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short

      # The shipped stub must say what the compiled module does.
      - name: Stub matches the extension
        if: matrix.python == '3.12'
        run: |
          source .venv/bin/activate
          pip install 'mypy==2.4.1'
          python -m mypy.stubtest wse_server._wse_accel

  # ---------------------------------------------------------------------------
  # Benchmarks: the tools behind the published numbers must still build
  # ---------------------------------------------------------------------------
  benchmarks:
    name: Benchmarks (build)
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: "benchmarks/rust-bench -> target"

      - name: rust-bench (cargo check)
        run: cargo check --manifest-path benchmarks/rust-bench/Cargo.toml --locked --all-targets

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: benchmarks/ts-bench/package-lock.json

      - name: ts-bench (type check)
        working-directory: benchmarks/ts-bench
        run: |
          npm ci --ignore-scripts
          npx tsc --noEmit -p .

      - name: Python benchmark scripts (syntax)
        run: python3 -m compileall -q benchmarks/

  # ---------------------------------------------------------------------------
  # Security: dependency audit (every step can fail the job)
  # ---------------------------------------------------------------------------
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # cargo-deny (deny.toml): advisories, yanked crates, licenses, sources
      # and wildcard versions, for the extension, xtask and the benchmarks.
      - name: Rust dependencies (workspace)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: Cargo.toml
          command: check

      - name: Rust dependencies (xtask)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: xtask/Cargo.toml
          command: check

      - name: Rust dependencies (benchmarks)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25  # v2.1.1
        with:
          manifest-path: benchmarks/rust-bench/Cargo.toml
          command: check

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      # The npm package's runtime dependencies (what users install). Dev
      # tooling advisories do not reach users and do not fail the build.
      - name: npm audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # wse-server has no Python runtime dependencies; wse-client[all] has
      # websockets, cryptography, msgpack and orjson. Resolve them as a user
      # would today and audit exactly that set.
      - name: pip-audit (Python client dependencies)
        run: |
          python -m venv /tmp/client-env
          /tmp/client-env/bin/pip install --quiet "./python-client[all]"
          /tmp/client-env/bin/pip freeze --exclude wse-client > /tmp/client-requirements.txt
          cat /tmp/client-requirements.txt
          python -m pip install --quiet 'pip-audit==2.10.1'
          python -m pip_audit --strict --no-deps --disable-pip --progress-spinner off -r /tmp/client-requirements.txt

  # ---------------------------------------------------------------------------
  # The one result to require for merging: every job passed or was skipped
  # because nothing it covers changed.
  # ---------------------------------------------------------------------------
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, secrets, client, frameworks, client-server, conformance, electron, tauri, python-client, lint, rust-lint, rust-test, rust-wasm, rust-fips, rust-msrv, swift, kotlin, android, react-native, dart, flutter-ios, test, benchmarks, security]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          results = {name: job["result"] for name, job in json.load(sys.stdin).items()}
          print(json.dumps(results, indent=2))
          bad = [name for name, result in results.items() if result not in ("success", "skipped")]
          if bad:
              sys.exit("failed or cancelled: " + ", ".join(bad))'
