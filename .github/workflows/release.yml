name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

env:
  CARGO_INCREMENTAL: 0

jobs:
  # ---------------------------------------------------------------------------
  # Build wheels for all platforms
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }} (${{ matrix.os }})
    runs-on: ${{ (matrix.os == 'linux' && 'ubuntu') || matrix.os }}-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: linux
            target: x86_64-unknown-linux-gnu
            manylinux: auto

          # Linux aarch64
          - os: linux
            target: aarch64-unknown-linux-gnu
            manylinux: 2_28

          # macOS x86_64 (Intel)
          - os: macos
            target: x86_64-apple-darwin

          # macOS arm64 (Apple Silicon)
          - os: macos
            target: aarch64-apple-darwin

          # Windows x86_64
          - os: windows
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup QEMU (for cross-compilation)
        if: matrix.os == 'linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist --find-interpreter
          sccache: ${{ matrix.os != 'windows' }}

      # Free-threaded CPython cannot load abi3 wheels, so 3.14t and 3.15t get
      # version-specific wheels. The Linux build containers ship these
      # interpreters; macOS and Windows runners get them from setup-python.
      - name: Set up free-threaded Python
        if: matrix.os != 'linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: |
            3.14t
            3.15t

      - name: Build free-threaded wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist -i python3.14t python3.15t
          sccache: ${{ matrix.os != 'windows' }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  # ---------------------------------------------------------------------------
  # Build source distribution
  # ---------------------------------------------------------------------------
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # Test built wheels on multiple platforms
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.os }} (Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
            target: linux-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            python: '3.13'
            target: linux-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            python: '3.14'
            target: linux-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            python: '3.15'
            target: linux-x86_64-unknown-linux-gnu
          - os: macos-14
            python: '3.12'
            target: macos-aarch64-apple-darwin
          - os: windows-latest
            python: '3.12'
            target: windows-x86_64-pc-windows-msvc
          # Free-threaded builds (no GIL)
          - os: ubuntu-latest
            python: '3.14t'
            target: linux-x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            python: '3.15t'
            target: linux-x86_64-unknown-linux-gnu
          - os: macos-14
            python: '3.14t'
            target: macos-aarch64-apple-darwin
          - os: macos-14
            python: '3.15t'
            target: macos-aarch64-apple-darwin
          - os: windows-latest
            python: '3.14t'
            target: windows-x86_64-pc-windows-msvc
          - os: windows-latest
            python: '3.15t'
            target: windows-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

      - name: Install wheel + test deps
        shell: bash
        run: |
          # dist/ holds the abi3 wheel and the free-threaded ones; pip picks
          # the one this interpreter can load.
          pip install --no-index --find-links dist wse-server
          pip install pytest pytest-asyncio httpx websockets cryptography

      - name: Run tests
        shell: bash
        run: |
          rm -rf wse_server/
          pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # Publish to PyPI (trusted publishing via OIDC)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish to PyPI
    needs: [build, sdist, test]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/wse-server/
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
          files: dist/*

  # ---------------------------------------------------------------------------
  # Build + test + publish wse-client (Python) to PyPI
  # ---------------------------------------------------------------------------
  publish-python-client:
    name: Publish Python Client to PyPI
    needs: [publish]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/wse-client/
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build tools + test deps
        run: pip install build pytest pytest-asyncio

      - name: Install package + optional deps
        run: pip install -e "python-client[all]"

      - name: Run tests
        run: pytest python-client/tests/ -v --tb=short

      - name: Build sdist + wheel
        run: python -m build python-client/ --outdir python-client-dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: python-client-dist/
          skip-existing: true

  # ---------------------------------------------------------------------------
  # Publish wse-client to npm
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish to npm
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync version from tag
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version

      - name: Check if version exists on npm
        id: npm-check
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          if npm view wse-client@"$TAG" version 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.npm-check.outputs.exists == 'false'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
