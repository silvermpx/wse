name: Release

# A v* tag push builds every artifact of the packages (wse-server and
# wse-client on PyPI, wse-client on npm, the wse and wse-client
# crates, and the mobile packages: the Swift XCFramework, the Android library
# and the Dart package with its prebuilt libraries), checks the tag against
# every version in the repo, installs and tests every wheel, the sdist, the
# Python client, the npm package, the crates as crates.io builds them and the
# mobile packages, and only then publishes: crates.io first, then npm, then
# PyPI, then the GitHub release, which carries the mobile packages; beside
# them the Android library goes to Maven Central, and after the GitHub release
# the Dart package to pub.dev and the Swift package to its repository
# (silvermpx/wse-swift). Nothing is uploaded until everything has passed.
#
# Pull requests and pushes to main that touch packaging run the same build
# and test jobs as a dry run, and workflow_dispatch runs that dry run by hand
# (on main right before tagging, for instance). Only a v* tag push publishes.
on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes: every v* tag runs.
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - '.cargo/**'
      - 'python-client/pyproject.toml'
      - 'python-client/wse_client/_version.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'ts-client/constants.ts'
      - 'bindings/swift/build.sh'
      - 'bindings/kotlin/build.sh'
      - 'bindings/kotlin/android/build-libs.sh'
      - 'bindings/kotlin/android/build.gradle.kts'
      - 'bindings/rustls-platform-verifier.*'
      - 'bindings/dart/android/**'
      - 'bindings/dart/pubspec.yaml'
      - 'bindings/dart/hook/**'
      - 'bindings/dart/example/run-integration-tests.sh'
      - 'bindings/dart/rust/Cargo.toml'
      - 'bindings/dart/rust/rust-toolchain.toml'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - '.cargo/**'
      - 'python-client/pyproject.toml'
      - 'python-client/wse_client/_version.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'ts-client/constants.ts'
      - 'bindings/swift/build.sh'
      - 'bindings/kotlin/build.sh'
      - 'bindings/kotlin/android/build-libs.sh'
      - 'bindings/kotlin/android/build.gradle.kts'
      - 'bindings/rustls-platform-verifier.*'
      - 'bindings/dart/android/**'
      - 'bindings/dart/pubspec.yaml'
      - 'bindings/dart/hook/**'
      - 'bindings/dart/example/run-integration-tests.sh'
      - 'bindings/dart/rust/Cargo.toml'
      - 'bindings/dart/rust/rust-toolchain.toml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A newer push supersedes a dry run; a tag run is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  # The maturin that builds every wheel and the sdist. Keep it equal to
  # MATURIN_VERSION in ci.yml and inside pyproject.toml's [build-system]
  # requires; without a pin maturin-action takes the newest release that
  # matches that range on the day of the release.
  MATURIN_VERSION: '1.16.0'

jobs:
  # ---------------------------------------------------------------------------
  # Versions and build flags. On a tag: the tag must equal every version in
  # the repo and must not be on PyPI or npm yet. Otherwise: every version
  # must agree.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (versions, build flags)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}
      npm-version: ${{ steps.versions.outputs.npm-version }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Versions agree${{ github.ref_type == 'tag' && ' with the tag' || '' }}
        id: versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 .github/scripts/release_preflight.py versions --tag "$REF_NAME"
          else
            python3 .github/scripts/release_preflight.py versions
          fi

      - name: No CPU-specific flags in committed cargo config
        run: python3 .github/scripts/release_preflight.py cargo-config

      # A crate name someone else holds would fail the release after the
      # gate, with npm and PyPI not out yet.
      - name: The crate names are new or ours
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          failed=0
          for crate in wse wse-client; do
            code="$(curl -sS -o owners.json -w '%{http_code}' --retry 3 \
              -A 'wse-release (github.com/silvermpx/wse)' \
              "https://crates.io/api/v1/crates/${crate}/owners" || true)"
            case "$code" in
              404) echo "crates.io ${crate}: a new crate" ;;
              200)
                if python3 -c 'import json, os, sys; sys.exit(os.environ["OWNER"] not in [u["login"] for u in json.load(open("owners.json"))["users"]])'; then
                  echo "crates.io ${crate}: owned by ${OWNER}"
                else
                  echo "::error::crates.io ${crate} belongs to someone else"; failed=1
                fi ;;
              *) echo "::error::crates.io answered HTTP ${code} for the owners of ${crate}"; failed=1 ;;
            esac
          done
          rm -f owners.json
          exit "$failed"

      # A re-run may find the version already uploaded by the attempt it
      # repeats; the publish jobs then skip what is there.
      - name: Version not published yet
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.run_attempt == '1'
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          NPM_VERSION: ${{ steps.versions.outputs.npm-version }}
        run: |
          # HTTP status only; 000 when the registry cannot be reached.
          status() { curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$1" || true; }
          failed=0
          for project in wse-server wse-client; do
            code="$(status "https://pypi.org/pypi/${project}/${VERSION}/json")"
            case "$code" in
              404) echo "PyPI ${project} ${VERSION}: not published yet" ;;
              200) echo "::error::${project} ${VERSION} is already on PyPI: bump the version"; failed=1 ;;
              *) echo "::error::PyPI answered HTTP ${code} for ${project} ${VERSION}"; failed=1 ;;
            esac
          done
          code="$(status "https://registry.npmjs.org/wse-client/${NPM_VERSION}")"
          case "$code" in
            404) echo "npm wse-client ${NPM_VERSION}: not published yet" ;;
            200) echo "::error::wse-client ${NPM_VERSION} is already on npm: bump the version"; failed=1 ;;
            *) echo "::error::npm answered HTTP ${code} for wse-client ${NPM_VERSION}"; failed=1 ;;
          esac
          # crates.io asks API clients to name themselves.
          for crate in wse wse-client; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
              -A 'wse-release (github.com/silvermpx/wse)' \
              "https://crates.io/api/v1/crates/${crate}/${NPM_VERSION}" || true)"
            case "$code" in
              404) echo "crates.io ${crate} ${NPM_VERSION}: not published yet" ;;
              200) echo "::error::${crate} ${NPM_VERSION} is already on crates.io: bump the version"; failed=1 ;;
              *) echo "::error::crates.io answered HTTP ${code} for ${crate} ${NPM_VERSION}"; failed=1 ;;
            esac
          done
          exit "$failed"

  # ---------------------------------------------------------------------------
  # wse-server wheels for every platform
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # An empty RUSTFLAGS makes cargo and maturin ignore every rustflags
      # entry of every cargo config file, so no committed or image-provided
      # config can tie the wheels to the build machine's CPU. maturin still
      # adds the linker flags it needs.
      RUSTFLAGS: ''
    strategy:
      fail-fast: false
      matrix:
        # Linux builds run in pinned images (tag for reading, digest for use).
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64:2026.11.07-1@sha256:62eeff30ef134a85ec0f97109e008a319b0315ca5e8a6d754ee771556c02622a
            free-threaded: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.11.07-1@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            free-threaded: true
          # musl: mimalloc must use local-dynamic TLS, or musl's loader
          # refuses the extension ("initial-exec TLS resolves to dynamic
          # definition"). No free-threaded wheels: no Alpine CPython to test them.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:3f1010eb48311dfde5d51f011163451940af34bd317355c4a8652ce6b4b61051
            free-threaded: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:02e790506c5f15a533bc05b3af8719b16a8a2314480f6f0fdc0166432035d9b4
            free-threaded: false
          # x86_64 macOS is cross-built on Apple silicon and tested on Intel.
          - runner: macos-15
            target: x86_64-apple-darwin
            free-threaded: true
          - runner: macos-15
            target: aarch64-apple-darwin
            free-threaded: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            free-threaded: true
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            free-threaded: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Linux builds bring Rust into their container. On macOS and Windows
      # the runner's toolchain builds; windows-11-arm may not ship rustup.
      - name: Set up Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - name: Set up Python 3.12 (Windows on Arm)
        id: py312
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          args: >-
            --release --locked --out dist
            ${{ steps.py312.outputs.python-path && format('-i {0}', steps.py312.outputs.python-path) || '--find-interpreter' }}
          # No build cache for tag builds: release wheels come from clean builds.
          sccache: ${{ runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/') }}

      # Free-threaded CPython cannot load abi3 wheels, so 3.14t and 3.15t get
      # version-specific wheels. The Linux build containers ship python3.14t
      # and python3.15t; macOS and Windows get them from setup-python and
      # pass them to maturin by path.
      - name: Set up Python 3.14t
        id: py314t
        if: matrix.free-threaded && runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14t'

      - name: Set up Python 3.15t
        id: py315t
        if: matrix.free-threaded && runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15t'

      - name: Build free-threaded wheels
        if: matrix.free-threaded
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          args: >-
            --release --locked --out dist -i
            ${{ runner.os == 'Linux' && 'python3.14t python3.15t' || format('{0} {1}', steps.py314t.outputs.python-path, steps.py315t.outputs.python-path) }}
          sccache: ${{ runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/') }}

      - name: List wheels
        shell: bash
        run: ls -l dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # wse-server source distribution
  # ---------------------------------------------------------------------------
  sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Install every wheel on its platform and run the server tests against it
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.target }} (Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.12'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.13'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.14'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.15'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.14t'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.15t'}
          # Linux aarch64
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: '3.12'}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: '3.14t'}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: '3.15t'}
          # macOS Apple silicon
          - {runner: macos-15, target: aarch64-apple-darwin, python: '3.12'}
          - {runner: macos-15, target: aarch64-apple-darwin, python: '3.14t'}
          - {runner: macos-15, target: aarch64-apple-darwin, python: '3.15t'}
          # macOS Intel
          - {runner: macos-15-intel, target: x86_64-apple-darwin, python: '3.12'}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, python: '3.14t'}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, python: '3.15t'}
          # Windows x86_64
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, python: '3.12'}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, python: '3.14t'}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, python: '3.15t'}
          # Windows on Arm
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, python: '3.12'}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, python: '3.14t'}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, python: '3.15t'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

      # dist/ holds the abi3 wheel and the free-threaded ones; pip picks the
      # one this interpreter can load. The Python client and cryptography play
      # the client side of the E2E tests; cryptography has no wheel for Intel
      # macOS or Windows on Arm, and there those tests are skipped rather than
      # built from source.
      - name: Install wheel + test deps
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ matrix.python }}
        run: |
          python -m pip install --no-index --find-links dist wse-server
          python -m pip install pytest pytest-asyncio httpx websockets prometheus-client ./python-client
          if ! python -m pip install --only-binary=:all: cryptography; then
            echo "::notice::No cryptography wheel for ${TARGET} / Python ${PYTHON}: the encrypted delivery test is skipped."
          fi

      - name: Run tests
        shell: bash
        run: |
          rm -rf wse_server/
          python -c "import sys, wse_server; print(wse_server.__file__, wse_server.__version__, sys.version)"
          python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # musllinux wheels, tested in Alpine
  # ---------------------------------------------------------------------------
  test-musllinux:
    name: Test ${{ matrix.target }} (Alpine, Python 3.12)
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

      - name: Install the wheel in python:3.12-alpine and run the tests
        run: |
          docker run --rm -v "$PWD:/src:ro" python:3.12-alpine sh -euc '
            cp -r /src/tests /src/pyproject.toml /src/python-client /tmp/
            cd /tmp
            python -m pip install --no-index --find-links /src/dist wse-server
            python -m pip install pytest pytest-asyncio httpx websockets cryptography prometheus-client ./python-client
            python -c "import sys, wse_server; print(wse_server.__file__, wse_server.__version__, sys.version)"
            python -m pytest tests/ -v --tb=short -p no:cacheprovider
          '

  # ---------------------------------------------------------------------------
  # The sdist builds from itself (as pip does for platforms without a wheel)
  # and the result passes the server tests
  # ---------------------------------------------------------------------------
  sdist-install:
    name: Install sdist (Linux, Python 3.12)
    needs: sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Build and install wse-server from the sdist
        run: python -m pip install -v dist/wse_server-*.tar.gz

      - name: Run tests
        run: |
          python -m pip install pytest pytest-asyncio httpx websockets cryptography prometheus-client ./python-client
          rm -rf wse_server/
          python -c "import sys, wse_server; print(wse_server.__file__, wse_server.__version__, sys.version)"
          python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # wse-client (PyPI): build, check the metadata, test the built wheel
  # ---------------------------------------------------------------------------
  python-client:
    name: Python client (build, check, test)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install 'build==1.6.1' 'twine==7.0.0'

      - name: Build sdist + wheel
        run: python -m build python-client/ --outdir python-client-dist/

      - name: Check metadata
        run: python -m twine check --strict python-client-dist/*

      # The tests' conftest puts python-client/ on sys.path; run a copy of
      # them outside the tree so they import the installed wheel instead.
      - name: Test the built wheel
        run: |
          wheel="$(ls python-client-dist/*.whl)"
          python -m pip install "${wheel}[all]" pytest pytest-asyncio
          work="$RUNNER_TEMP/client-wheel-test"
          mkdir -p "$work"
          cp -r python-client/tests python-client/pyproject.toml "$work/"
          cd "$work"
          python -c "import wse_client; print(wse_client.__file__, wse_client.__version__)"
          python -m pytest tests/ -v --tb=short -p no:cacheprovider

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-client-dist
          path: python-client-dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # wse-client (npm): type check, unit tests, build, pack, consumer check
  # ---------------------------------------------------------------------------
  npm-package:
    name: npm package (build, test, pack)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist
          tar -tzf npm-dist/wse-client-*.tgz

      - name: Consumer check (esbuild bundle, Node import)
        run: bash .github/scripts/npm-consumer-check.sh npm-dist/wse-client-*.tgz

      # React Native's Metro bundles it, its Babel preset transforms it, and
      # Hermes compiles the bundle.
      - name: React Native check (Metro bundle, Hermes bytecode)
        run: bash .github/scripts/rn-bundle-check.sh npm-dist/wse-client-*.tgz

      # The publish job's command, without uploading.
      - name: Publish dry run
        run: npm publish --dry-run --ignore-scripts --access public ./npm-dist/wse-client-*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The Rust crates: packaged, and each built from its package as crates.io
  # builds it, the ones it depends on taken from the packages beside it;
  # their tests, and the client's browser build.
  # ---------------------------------------------------------------------------
  crates:
    name: Rust crates (package, build, test)
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          workspaces: ". -> target"
          key: crates

      - name: cargo publish --dry-run
        run: cargo publish --locked --dry-run -p wse -p wse-client

      - name: What each package holds
        run: |
          for crate in wse wse-client; do
            echo "== ${crate}"
            cargo package --locked --list -p "$crate"
          done

      - name: The crates' tests
        run: cargo test --locked -p wse -p wse-client

      - name: The client in the browser (wasm32)
        run: cargo check --locked -p wse-client --target wasm32-unknown-unknown

  # ---------------------------------------------------------------------------
  # The mobile packages, attached to the GitHub release: the Swift
  # XCFramework (zip, and the checksum SwiftPM asks for), the Android library
  # (AAR), and the Dart package with the prebuilt Rust libraries its build
  # hook downloads from this release. Each is built and tested here; their
  # registries are set up by hand.
  # ---------------------------------------------------------------------------
  swift-package:
    name: Swift XCFramework
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 60  # a simulator or an emulator can hang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      # On the simulator as an app ships: the Release configuration.
      - name: Build, then the tests on the Mac and on an iOS simulator
        env:
          SIMULATOR: '1'
          CONFIGURATION: Release
        run: bindings/swift/run-tests.sh

      - name: Zip, and its checksum
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: |
          mkdir -p dist
          zip="dist/WseFFIC-${VERSION}.xcframework.zip"
          ditto -c -k --sequesterRsrc --keepParent bindings/swift/WseFFIC.xcframework "$zip"
          (cd bindings/swift && swift package compute-checksum "../../$zip") > "$zip.checksum"
          cat "$zip.checksum"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: swift-package
          path: dist/*
          if-no-files-found: error

  android-package:
    name: Android library (AAR)
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: '9.9.1'

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        with:
          tool: cargo-ndk@4.1.2

      # The newest NDK on the runner links for 16 KB pages; build-libs.sh checks.
      - name: Bindings, and the libraries of every ABI
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          bindings/kotlin/build.sh
          bindings/kotlin/android/build-libs.sh

      - name: AAR
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: |
          (cd bindings/kotlin/android && gradle --no-daemon -q assembleRelease)
          mkdir -p dist
          cp bindings/kotlin/android/build/outputs/aar/*-release.aar "dist/wse-client-android-${VERSION}.aar"
          unzip -l "dist/wse-client-android-${VERSION}.aar"
          # Android's certificate verifier: its Java part travels inside.
          unzip -l "dist/wse-client-android-${VERSION}.aar" | grep -q 'libs/rustls-platform-verifier.jar'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-package
          path: dist/*
          if-no-files-found: error

  dart-binaries:
    name: Dart libraries (${{ matrix.name }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The targets of DART_TARGETS in release_preflight.py. Linux builds on
        # the oldest Ubuntu runner, for the oldest glibc.
        include:
          - name: apple
            runner: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
          - name: android
            runner: ubuntu-24.04
            targets: aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          - name: linux-x64
            runner: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            targets: aarch64-unknown-linux-gnu
          - name: windows-x64
            runner: windows-latest
            targets: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: The Rust the Dart package pins, with these targets
        shell: bash
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' bindings/dart/rust/rust-toolchain.toml)"
          read -ra targets <<< "$TARGETS"
          # rustup takes several targets as one comma-separated list.
          rustup toolchain install "$channel" --profile minimal --target "$(IFS=,; echo "${targets[*]}")"
          rustup default "$channel"

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519  # v2.90.5
        if: matrix.name == 'android'
        with:
          tool: cargo-ndk@4.1.2

      # Windows: aws-lc's assembly from the objects it ships, without NASM.
      - name: Build
        shell: bash
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          TARGETS: ${{ matrix.targets }}
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          read -ra targets <<< "$TARGETS"
          bash .github/scripts/dart-binaries.sh "$VERSION" dist "${targets[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dart-binaries-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  dart-package:
    name: Dart package
    needs: [preflight, dart-binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dart-binaries-*
          path: dart-binaries/
          merge-multiple: true

      - name: Stage the package
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: bash .github/scripts/stage-dart-package.sh "$VERSION" dart-binaries dart-package

      # flutter_rust_bridge's Dart and Rust halves must be one version, so
      # the package pins it and its hooks exactly, and pub warns about the
      # two pins (exit 65). Any other warning fails.
      - name: pub.dev's checks (dry run)
        working-directory: dart-package
        run: |
          code=0
          dart pub publish --dry-run > ../pub-dry-run.txt 2>&1 || code=$?
          cat ../pub-dry-run.txt
          if [ "$code" -eq 65 ] && grep -q '^Package has 2 warnings' ../pub-dry-run.txt \
            && grep -q 'dependency on "flutter_rust_bridge" should allow more than one version' ../pub-dry-run.txt \
            && grep -q 'dependency on "flutter_rust_bridge_hooks" should allow more than one version' ../pub-dry-run.txt; then
            echo "Only the two exact flutter_rust_bridge pins."
            code=0
          fi
          exit "$code"

      - name: Pack
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: |
          mkdir -p dist
          tar -czf "dist/wse_client-dart-${VERSION}.tar.gz" -C dart-package .

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dart-package
          path: dist/*
          if-no-files-found: error

  # The staged package's tests on each platform with a prebuilt library: the
  # build hook takes this runner's from the release's files and checks it
  # against the list the package carries. Then its example as a desktop app:
  # the integration test, and the release build run from a folder of its own.
  dart-check:
    name: Dart package on ${{ matrix.name }}
    needs: [preflight, dart-package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60  # a desktop app can hang
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          - name: macOS arm64
            runner: macos-latest
          - name: macOS x64
            runner: macos-15-intel
          - name: Windows x64
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        if: matrix.name != 'Linux arm64'
        with:
          flutter-version: '3.50.0'
          channel: stable

      # Flutter publishes no SDK for Linux arm64: there it comes from its
      # repository, at the same version.
      - name: Flutter from its repository
        if: matrix.name == 'Linux arm64'
        run: |
          git clone --quiet --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dart-binaries-*
          path: dart-binaries/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dart-package
          path: dart-dist/

      # The example server builds aws-lc; on Windows from the assembly
      # objects it ships, without NASM.
      - name: The tests on the prebuilt library
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: |
          mkdir dart-package
          tar -xzf "dart-dist/wse_client-dart-${VERSION}.tar.gz" -C dart-package
          bash .github/scripts/dart-check.sh dart-package dart-binaries

      # A Flutter app on Linux is a GTK app: its build tools, and a display.
      - name: Linux desktop tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev xvfb

      - name: The example app on this desktop, on the prebuilt library
        env:
          AWS_LC_SYS_PREBUILT_NASM: '1'
        run: |
          case "$RUNNER_OS" in
            macOS) .github/scripts/dart-app-check.sh dart-package dart-binaries macos ;;
            Windows) .github/scripts/dart-app-check.sh dart-package dart-binaries windows ;;
            Linux) xvfb-run -a .github/scripts/dart-app-check.sh dart-package dart-binaries linux ;;
          esac

  # The staged package's example app on an Android emulator (its integration
  # test, then its release build) and on an iOS simulator, the build hook
  # taking the device's prebuilt library from the release's files.
  dart-mobile:
    name: Dart package on ${{ matrix.name }}
    needs: [preflight, dart-package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60  # a simulator or an emulator can hang
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            runner: ubuntu-24.04
          - name: iOS
            runner: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        if: matrix.name == 'Android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        if: matrix.name == 'Android'
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: dart-binaries-*
          path: dart-binaries/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dart-package
          path: dart-dist/

      - name: Unpack the package
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: |
          mkdir dart-package
          tar -xzf "dart-dist/wse_client-dart-${VERSION}.tar.gz" -C dart-package

      - name: The example on an emulator, on the prebuilt libraries
        if: matrix.name == 'Android'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: .github/scripts/dart-app-check.sh dart-package dart-binaries emulator-5554

      - name: The example on an iOS simulator, on the prebuilt library
        if: matrix.name == 'iOS'
        run: |
          device="$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          .github/scripts/dart-app-check.sh dart-package dart-binaries "$device"

  # The release AAR in an app built with R8, on an emulator: the system's
  # TLS, a tick, an end-to-end encrypted echo and a signed receipt.
  android-release-app:
    name: Android release app
    needs: [preflight, android-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # a simulator or an emulator can hang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1
        with:
          gradle-version: '9.9.1'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: android-package
          path: dist/

      - name: The app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: ANDROID_SERIAL=emulator-5554 WSE_AAR="dist/wse-client-android-${VERSION}.aar" bindings/kotlin/android/run-consumer-check.sh

  # The npm package in an app made from React Native's template, built for
  # release (Hermes bytecode) and run on an emulator against the example
  # server: React Native's WebSocket, a tick and an echo.
  react-native-app:
    name: React Native app
    needs: [preflight, npm-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # a simulator or an emulator can hang
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: npm-dist/

      - name: The app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d  # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: bash .github/scripts/rn-app-check.sh npm-dist/wse-client-*.tgz emulator-5554

  # The Android library for Maven Central (io.github.silvermpx:wse-client-android):
  # on every run its bundle is signed with the release key and the Central
  # Portal is asked whether it takes the token; publish-maven-central uploads
  # it on a tag. A pull request from a fork, without the secrets, builds it
  # unsigned.
  maven-central:
    name: Maven Central bundle (signed, not uploaded)
    needs: [preflight, android-package]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: android-package
          path: dist/

      - name: The bundle, and the Portal's answer to the token
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          mode=--check
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ -z "$MAVEN_GPG_PRIVATE_KEY" ]; then mode=; fi
          bash .github/scripts/maven-central.sh "$VERSION" "dist/wse-client-android-${VERSION}.aar" maven $mode

  # The Swift package's own repository (silvermpx/wse-swift) as the release
  # writes it, built on a Mac against this run's XCFramework, and the deploy
  # key tried; publish-swift commits and tags it on a tag.
  swift-repo:
    name: Swift package repository (built, not pushed)
    needs: [preflight, swift-package]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: swift-package
          path: dist/

      - name: The package, built here
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          SWIFT_REPO_DEPLOY_KEY: ${{ secrets.SWIFT_REPO_DEPLOY_KEY }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && [ -z "$SWIFT_REPO_DEPLOY_KEY" ]; then
            echo "::error::no SWIFT_REPO_DEPLOY_KEY: the release could not write silvermpx/wse-swift"
            exit 1
          fi
          bash .github/scripts/swift-repo.sh "$VERSION" "dist/WseFFIC-${VERSION}.xcframework.zip" swift-repo --check

  # ---------------------------------------------------------------------------
  # Everything built, tested and carrying the release version: the one job
  # that says whether this commit could be released. The publish jobs wait
  # for it. (Not a required check: path filters keep this workflow off most
  # pull requests, and a required check that never runs blocks the merge.)
  # ---------------------------------------------------------------------------
  release-gate:
    name: Release gate
    needs: [preflight, build, sdist, test, test-musllinux, sdist-install, python-client, npm-package, crates, swift-package, android-package, android-release-app, react-native-app, maven-central, swift-repo, dart-binaries, dart-package, dart-check, dart-mobile]
    # Runs (and fails) when a job above failed: a gate skipped because of a
    # failed dependency would report success to branch protection.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every release job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "::error::A release job failed, was cancelled or was skipped: ${RESULTS}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Everything CI checks (the clients against servers, the mobile
      # emulators and simulators, lint, security), passed for this commit.
      - name: CI passed for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/wait-for-ci.sh "$GITHUB_REPOSITORY" "$COMMIT"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts/

      - name: Every file carries the release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NPM_VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: python3 .github/scripts/release_preflight.py artifacts --version "$VERSION" --npm-version "$NPM_VERSION" artifacts/

      - name: PyPI metadata (twine check --strict)
        run: |
          python -m pip install 'twine==7.0.0'
          python -m twine check --strict artifacts/wheels-*/*.whl artifacts/sdist/*.tar.gz artifacts/python-client-dist/*

  # ---------------------------------------------------------------------------
  # Publish (v* tag pushes only), in order: crates.io, npm, PyPI, GitHub
  # release. The newest moving part goes first, crates.io and its token, then
  # npm and its trusted publisher: if one fails, nothing after it is out yet.
  # Every publish job skips what an earlier attempt already uploaded, so
  # "Re-run failed jobs" finishes a release.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish wse-client to npm
    needs: [preflight, release-gate, publish-crates]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://www.npmjs.com/package/wse-client
    permissions:
      # Provenance, and npm trusted publishing (OIDC) once it is set up for
      # the package.
      id-token: write
    steps:
      # npm >= 11.5.1 tries trusted publishing first and falls back to the
      # NPM_TOKEN in the .npmrc that registry-url writes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: npm-dist/

      - name: Publish the tested tarball
        env:
          NPM_VERSION: ${{ needs.preflight.outputs.npm-version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://registry.npmjs.org/wse-client/${NPM_VERSION}" || true)"
          if [ "$code" = 200 ]; then
            echo "wse-client ${NPM_VERSION} is already on npm (an earlier attempt); nothing to publish."
            exit 0
          fi
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          # "./": without it npm reads "npm-dist/<file>" as a GitHub repository.
          npm publish "./npm-dist/wse-client-${NPM_VERSION}.tgz" \
            --provenance --access public --tag "$tag" --ignore-scripts

  publish-pypi:
    name: Publish wse-client and wse-server to PyPI
    needs: [preflight, release-gate, publish-npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/wse-server/
    permissions:
      # Trusted publishing (OIDC) only: no checkout, no repository write.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-client-dist
          path: python-client-dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish wse-client
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: python-client-dist/
          # The first attempt must upload everything; a re-run skips files an
          # earlier attempt already uploaded.
          skip-existing: ${{ github.run_attempt != '1' }}

      - name: Publish wse-server
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: ${{ github.run_attempt != '1' }}

  # The first publish of a crate needs a crates.io API token (repository
  # secret CARGO_REGISTRY_TOKEN, scope publish-new and publish-update); once
  # the crates exist, crates.io trusted publishing can take its place.
  publish-crates:
    name: Publish the Rust crates to crates.io
    needs: [preflight, release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://crates.io/crates/wse
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - name: Publish what is not on crates.io yet
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          packages=()
          for crate in wse wse-client; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 \
              -A 'wse-release (github.com/silvermpx/wse)' \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}" || true)"
            if [ "$code" = 200 ]; then
              echo "${crate} ${VERSION} is on crates.io already (an earlier attempt)."
            else
              packages+=(-p "$crate")
            fi
          done
          if [ "${#packages[@]}" -eq 0 ]; then
            exit 0
          fi
          # In dependency order, each built from its package before upload.
          cargo publish --locked "${packages[@]}"

  github-release:
    name: GitHub release
    needs: [preflight, publish-pypi, publish-crates]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          files: release/*

  # On Maven Central as io.github.silvermpx:wse-client-android: the bundle the
  # dry run built, signed, uploaded and waited for until it is published.
  publish-maven-central:
    name: Publish the Android library to Maven Central
    needs: [preflight, release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://central.sonatype.com/artifact/io.github.silvermpx/wse-client-android
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: android-package
          path: dist/

      - name: Upload, and wait until Maven Central has it
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: bash .github/scripts/maven-central.sh "$VERSION" "dist/wse-client-android-${VERSION}.aar" maven --upload

  # On pub.dev as wse_client, once its prebuilt libraries are on the GitHub
  # release it downloads them from. pub.dev takes a package's first version
  # from its owner by hand (dart pub publish from this release's
  # wse_client-dart-<version>.tar.gz) and the later ones from this job, by the
  # job's own token (automated publishing for silvermpx/wse, tags v{{version}}).
  publish-pub-dev:
    name: Publish wse_client to pub.dev
    needs: [preflight, release-gate, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pub.dev/packages/wse_client
    permissions:
      id-token: write
    steps:
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: '3.50.0'
          channel: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dart-package
          path: dart-dist/

      - name: The tested package, unless pub.dev has it
        id: package
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: |
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://pub.dev/api/packages/wse_client/versions/${VERSION}" || true)"
          if [ "$code" = 200 ]; then
            echo "wse_client ${VERSION} is on pub.dev already (by hand, or an earlier attempt); nothing to publish."
            exit 0
          fi
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://pub.dev/api/packages/wse_client" || true)"
          if [ "$code" = 404 ]; then
            echo "::warning::wse_client is not on pub.dev yet: its first version goes by hand, from wse_client-dart-${VERSION}.tar.gz of this release."
            exit 0
          fi
          mkdir dart-package
          tar -xzf "dart-dist/wse_client-dart-${VERSION}.tar.gz" -C dart-package
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Trades the job's OIDC token for pub.dev's (PUB_TOKEN). The token lives
      # about five minutes, so it is taken right before the upload.
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d  # v1
        if: steps.package.outputs.publish == 'true'

      - name: Publish the tested package
        if: steps.package.outputs.publish == 'true'
        working-directory: dart-package
        run: flutter pub publish --force

  # The Swift package's repository (silvermpx/wse-swift): this version's
  # Package.swift, naming the XCFramework on the GitHub release, committed and
  # tagged there.
  publish-swift:
    name: Publish the Swift package (silvermpx/wse-swift)
    needs: [preflight, github-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://github.com/silvermpx/wse-swift
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: swift-package
          path: dist/

      - name: Commit and tag the version there
        env:
          VERSION: ${{ needs.preflight.outputs.npm-version }}
          SWIFT_REPO_DEPLOY_KEY: ${{ secrets.SWIFT_REPO_DEPLOY_KEY }}
        run: bash .github/scripts/swift-repo.sh "$VERSION" "dist/WseFFIC-${VERSION}.xcframework.zip" swift-repo --push
