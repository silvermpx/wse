name: Release

# A v* tag push builds every artifact of the three packages (wse-server and
# wse-client on PyPI, wse-client on npm), checks the tag against every version
# in the repo, installs and tests every wheel, the sdist, the Python client
# and the npm package, and only then publishes: npm first, then PyPI, then
# the GitHub release. Nothing is uploaded until everything has passed.
#
# Pull requests and pushes to main that touch packaging run the same build
# and test jobs as a dry run, and workflow_dispatch runs that dry run by hand
# (on main right before tagging, for instance). Only a v* tag push publishes.
on:
  push:
    branches: [main]
    # Path filters are not evaluated for tag pushes: every v* tag runs.
    tags: ['v*']
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/.cargo/**'
      - 'python-client/pyproject.toml'
      - 'python-client/wse_client/_version.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'ts-client/constants.ts'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - 'pyproject.toml'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - 'rust/.cargo/**'
      - 'python-client/pyproject.toml'
      - 'python-client/wse_client/_version.py'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'ts-client/constants.ts'
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # A newer push supersedes a dry run; a tag run is never cancelled.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_INCREMENTAL: 0
  # The maturin that builds every wheel and the sdist. Keep it equal to
  # MATURIN_VERSION in ci.yml and inside pyproject.toml's [build-system]
  # requires; without a pin maturin-action takes the newest release that
  # matches that range on the day of the release.
  MATURIN_VERSION: '1.16.0'

jobs:
  # ---------------------------------------------------------------------------
  # Versions and build flags. On a tag: the tag must equal every version in
  # the repo and must not be on PyPI or npm yet. Otherwise: every version
  # must agree.
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (versions, build flags)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.versions.outputs.version }}
      npm-version: ${{ steps.versions.outputs.npm-version }}
      prerelease: ${{ steps.versions.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Versions agree${{ github.ref_type == 'tag' && ' with the tag' || '' }}
        id: versions
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python3 .github/scripts/release_preflight.py versions --tag "$REF_NAME"
          else
            python3 .github/scripts/release_preflight.py versions
          fi

      - name: No CPU-specific flags in committed cargo config
        run: python3 .github/scripts/release_preflight.py cargo-config

      # A re-run may find the version already uploaded by the attempt it
      # repeats; the publish jobs then skip what is there.
      - name: Version not published yet
        if: github.event_name == 'push' && github.ref_type == 'tag' && github.run_attempt == '1'
        env:
          VERSION: ${{ steps.versions.outputs.version }}
          NPM_VERSION: ${{ steps.versions.outputs.npm-version }}
        run: |
          # HTTP status only; 000 when the registry cannot be reached.
          status() { curl -sS -o /dev/null -w '%{http_code}' --retry 3 "$1" || true; }
          failed=0
          for project in wse-server wse-client; do
            code="$(status "https://pypi.org/pypi/${project}/${VERSION}/json")"
            case "$code" in
              404) echo "PyPI ${project} ${VERSION}: not published yet" ;;
              200) echo "::error::${project} ${VERSION} is already on PyPI: bump the version"; failed=1 ;;
              *) echo "::error::PyPI answered HTTP ${code} for ${project} ${VERSION}"; failed=1 ;;
            esac
          done
          code="$(status "https://registry.npmjs.org/wse-client/${NPM_VERSION}")"
          case "$code" in
            404) echo "npm wse-client ${NPM_VERSION}: not published yet" ;;
            200) echo "::error::wse-client ${NPM_VERSION} is already on npm: bump the version"; failed=1 ;;
            *) echo "::error::npm answered HTTP ${code} for wse-client ${NPM_VERSION}"; failed=1 ;;
          esac
          exit "$failed"

  # ---------------------------------------------------------------------------
  # wse-server wheels for every platform
  # ---------------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      # An empty RUSTFLAGS makes cargo and maturin ignore every rustflags
      # entry of every cargo config file, so no committed or image-provided
      # config can tie the wheels to the build machine's CPU. maturin still
      # adds the linker flags it needs.
      RUSTFLAGS: ''
    strategy:
      fail-fast: false
      matrix:
        # Linux builds run in pinned images (tag for reading, digest for use).
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: auto
            container: quay.io/pypa/manylinux2014_x86_64:2026.11.07-1@sha256:62eeff30ef134a85ec0f97109e008a319b0315ca5e8a6d754ee771556c02622a
            free-threaded: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: '2_28'
            container: quay.io/pypa/manylinux_2_28_aarch64:2026.11.07-1@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
            free-threaded: true
          # musl: mimalloc must use local-dynamic TLS, or musl's loader
          # refuses the extension ("initial-exec TLS resolves to dynamic
          # definition"). No free-threaded wheels: no Alpine CPython to test them.
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:x86_64-musl@sha256:3f1010eb48311dfde5d51f011163451940af34bd317355c4a8652ce6b4b61051
            free-threaded: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            container: ghcr.io/rust-cross/rust-musl-cross:aarch64-musl@sha256:02e790506c5f15a533bc05b3af8719b16a8a2314480f6f0fdc0166432035d9b4
            free-threaded: false
          # x86_64 macOS is cross-built on Apple silicon and tested on Intel.
          - runner: macos-15
            target: x86_64-apple-darwin
            free-threaded: true
          - runner: macos-15
            target: aarch64-apple-darwin
            free-threaded: true
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            free-threaded: true
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            free-threaded: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Linux builds bring Rust into their container. On macOS and Windows
      # the runner's toolchain builds; windows-11-arm may not ship rustup.
      - name: Set up Rust
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - name: Set up Python 3.12 (Windows on Arm)
        id: py312
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Build abi3 wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          args: >-
            --release --locked --out dist
            ${{ steps.py312.outputs.python-path && format('-i {0}', steps.py312.outputs.python-path) || '--find-interpreter' }}
          # No build cache for tag builds: release wheels come from clean builds.
          sccache: ${{ runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/') }}

      # Free-threaded CPython cannot load abi3 wheels, so 3.14t and 3.15t get
      # version-specific wheels. The Linux build containers ship python3.14t
      # and python3.15t; macOS and Windows get them from setup-python and
      # pass them to maturin by path.
      - name: Set up Python 3.14t
        id: py314t
        if: matrix.free-threaded && runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.14t'

      - name: Set up Python 3.15t
        id: py315t
        if: matrix.free-threaded && runner.os != 'Linux'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.15t'

      - name: Build free-threaded wheels
        if: matrix.free-threaded
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          container: ${{ matrix.container }}
          args: >-
            --release --locked --out dist -i
            ${{ runner.os == 'Linux' && 'python3.14t python3.15t' || format('{0} {1}', steps.py314t.outputs.python-path, steps.py315t.outputs.python-path) }}
          sccache: ${{ runner.os != 'Windows' && !startsWith(github.ref, 'refs/tags/') }}

      - name: List wheels
        shell: bash
        run: ls -l dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # wse-server source distribution
  # ---------------------------------------------------------------------------
  sdist:
    name: Build sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          maturin-version: ${{ env.MATURIN_VERSION }}
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Install every wheel on its platform and run the server tests against it
  # ---------------------------------------------------------------------------
  test:
    name: Test ${{ matrix.target }} (Python ${{ matrix.python }})
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.12'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.13'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.14'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.15'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.14t'}
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: '3.15t'}
          # Linux aarch64
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: '3.12'}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: '3.14t'}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: '3.15t'}
          # macOS Apple silicon
          - {runner: macos-15, target: aarch64-apple-darwin, python: '3.12'}
          - {runner: macos-15, target: aarch64-apple-darwin, python: '3.14t'}
          - {runner: macos-15, target: aarch64-apple-darwin, python: '3.15t'}
          # macOS Intel
          - {runner: macos-15-intel, target: x86_64-apple-darwin, python: '3.12'}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, python: '3.14t'}
          - {runner: macos-15-intel, target: x86_64-apple-darwin, python: '3.15t'}
          # Windows x86_64
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, python: '3.12'}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, python: '3.14t'}
          - {runner: windows-2025, target: x86_64-pc-windows-msvc, python: '3.15t'}
          # Windows on Arm
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, python: '3.12'}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, python: '3.14t'}
          - {runner: windows-11-arm, target: aarch64-pc-windows-msvc, python: '3.15t'}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

      # dist/ holds the abi3 wheel and the free-threaded ones; pip picks the
      # one this interpreter can load. The Python client and cryptography play
      # the client side of the E2E tests; cryptography has no wheel for Intel
      # macOS or Windows on Arm, and there those tests are skipped rather than
      # built from source.
      - name: Install wheel + test deps
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PYTHON: ${{ matrix.python }}
        run: |
          python -m pip install --no-index --find-links dist wse-server
          python -m pip install pytest pytest-asyncio httpx websockets prometheus-client ./python-client
          if ! python -m pip install --only-binary=:all: cryptography; then
            echo "::notice::No cryptography wheel for ${TARGET} / Python ${PYTHON}: the encrypted delivery test is skipped."
          fi

      - name: Run tests
        shell: bash
        run: |
          rm -rf wse_server/
          python -c "import sys, wse_server; print(wse_server.__file__, wse_server.__version__, sys.version)"
          python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # musllinux wheels, tested in Alpine
  # ---------------------------------------------------------------------------
  test-musllinux:
    name: Test ${{ matrix.target }} (Alpine, Python 3.12)
    needs: build
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/

      - name: Install the wheel in python:3.12-alpine and run the tests
        run: |
          docker run --rm -v "$PWD:/src:ro" python:3.12-alpine sh -euc '
            cp -r /src/tests /src/pyproject.toml /src/python-client /tmp/
            cd /tmp
            python -m pip install --no-index --find-links /src/dist wse-server
            python -m pip install pytest pytest-asyncio httpx websockets cryptography prometheus-client ./python-client
            python -c "import sys, wse_server; print(wse_server.__file__, wse_server.__version__, sys.version)"
            python -m pytest tests/ -v --tb=short -p no:cacheprovider
          '

  # ---------------------------------------------------------------------------
  # The sdist builds from itself (as pip does for platforms without a wheel)
  # and the result passes the server tests
  # ---------------------------------------------------------------------------
  sdist-install:
    name: Install sdist (Linux, Python 3.12)
    needs: sdist
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Build and install wse-server from the sdist
        run: python -m pip install -v dist/wse_server-*.tar.gz

      - name: Run tests
        run: |
          python -m pip install pytest pytest-asyncio httpx websockets cryptography prometheus-client ./python-client
          rm -rf wse_server/
          python -c "import sys, wse_server; print(wse_server.__file__, wse_server.__version__, sys.version)"
          python -m pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # wse-client (PyPI): build, check the metadata, test the built wheel
  # ---------------------------------------------------------------------------
  python-client:
    name: Python client (build, check, test)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: Install build tools
        run: python -m pip install 'build==1.6.1' 'twine==7.0.0'

      - name: Build sdist + wheel
        run: python -m build python-client/ --outdir python-client-dist/

      - name: Check metadata
        run: python -m twine check --strict python-client-dist/*

      # The tests' conftest puts python-client/ on sys.path; run a copy of
      # them outside the tree so they import the installed wheel instead.
      - name: Test the built wheel
        run: |
          wheel="$(ls python-client-dist/*.whl)"
          python -m pip install "${wheel}[all]" pytest pytest-asyncio
          work="$RUNNER_TEMP/client-wheel-test"
          mkdir -p "$work"
          cp -r python-client/tests python-client/pyproject.toml "$work/"
          cd "$work"
          python -c "import wse_client; print(wse_client.__file__, wse_client.__version__)"
          python -m pytest tests/ -v --tb=short -p no:cacheprovider

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-client-dist
          path: python-client-dist/*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # wse-client (npm): type check, unit tests, build, pack, consumer check
  # ---------------------------------------------------------------------------
  npm-package:
    name: npm package (build, test, pack)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Pack
        run: |
          mkdir -p npm-dist
          npm pack --ignore-scripts --pack-destination npm-dist
          tar -tzf npm-dist/wse-client-*.tgz

      - name: Consumer check (esbuild bundle, Node import)
        run: bash .github/scripts/npm-consumer-check.sh npm-dist/wse-client-*.tgz

      # The publish job's command, without uploading.
      - name: Publish dry run
        run: npm publish --dry-run --ignore-scripts --access public ./npm-dist/wse-client-*.tgz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: npm-dist/*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Everything built, tested and carrying the release version: the one job
  # that says whether this commit could be released. The publish jobs wait
  # for it. (Not a required check: path filters keep this workflow off most
  # pull requests, and a required check that never runs blocks the merge.)
  # ---------------------------------------------------------------------------
  release-gate:
    name: Release gate
    needs: [preflight, build, sdist, test, test-musllinux, sdist-install, python-client, npm-package]
    # Runs (and fails) when a job above failed: a gate skipped because of a
    # failed dependency would report success to branch protection.
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Every release job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "::error::A release job failed, was cancelled or was skipped: ${RESULTS}"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: artifacts/

      - name: Every file carries the release version
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          NPM_VERSION: ${{ needs.preflight.outputs.npm-version }}
        run: python3 .github/scripts/release_preflight.py artifacts --version "$VERSION" --npm-version "$NPM_VERSION" artifacts/

      - name: PyPI metadata (twine check --strict)
        run: |
          python -m pip install 'twine==7.0.0'
          python -m twine check --strict artifacts/wheels-*/*.whl artifacts/sdist/*.tar.gz artifacts/python-client-dist/*

  # ---------------------------------------------------------------------------
  # Publish (v* tag pushes only), in order: npm, PyPI, GitHub release. npm
  # goes first because its trusted publisher is the newest moving part: if it
  # fails, nothing is on PyPI yet. Every publish job skips what an earlier
  # attempt already uploaded, so "Re-run failed jobs" finishes a release.
  # ---------------------------------------------------------------------------
  publish-npm:
    name: Publish wse-client to npm
    needs: [preflight, release-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://www.npmjs.com/package/wse-client
    permissions:
      # Provenance, and npm trusted publishing (OIDC) once it is set up for
      # the package.
      id-token: write
    steps:
      # npm >= 11.5.1 tries trusted publishing first and falls back to the
      # NPM_TOKEN in the .npmrc that registry-url writes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: npm-dist/

      - name: Publish the tested tarball
        env:
          NPM_VERSION: ${{ needs.preflight.outputs.npm-version }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 "https://registry.npmjs.org/wse-client/${NPM_VERSION}" || true)"
          if [ "$code" = 200 ]; then
            echo "wse-client ${NPM_VERSION} is already on npm (an earlier attempt); nothing to publish."
            exit 0
          fi
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          # "./": without it npm reads "npm-dist/<file>" as a GitHub repository.
          npm publish "./npm-dist/wse-client-${NPM_VERSION}.tgz" \
            --provenance --access public --tag "$tag" --ignore-scripts

  publish-pypi:
    name: Publish wse-client and wse-server to PyPI
    needs: [preflight, release-gate, publish-npm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: release
      url: https://pypi.org/project/wse-server/
    permissions:
      # Trusted publishing (OIDC) only: no checkout, no repository write.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-client-dist
          path: python-client-dist/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish wse-client
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: python-client-dist/
          # The first attempt must upload everything; a re-run skips files an
          # earlier attempt already uploaded.
          skip-existing: ${{ github.run_attempt != '1' }}

      - name: Publish wse-server
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          packages-dir: dist/
          skip-existing: ${{ github.run_attempt != '1' }}

  github-release:
    name: GitHub release
    needs: [preflight, publish-pypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: release/
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ needs.preflight.outputs.prerelease == 'true' }}
          files: release/*
