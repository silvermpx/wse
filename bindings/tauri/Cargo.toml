# Tauri's plugin for WSE (plugin/, the `tauri-plugin-wse` crate) and the
# Tauri application that runs the conformance cases in a real webview
# (conformance/, not published). A workspace of its own: Tauri builds
# against a webview's system libraries (GTK and WebKitGTK on Linux), which
# the main workspace never asks for.
[workspace]
members = ["plugin", "conformance"]
resolver = "3"

[workspace.package]
version = "3.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/silvermpx/wse"

[workspace.dependencies]
tauri = { version = "2.12.6", default-features = false }
wse-client = { version = "=3.1.0", path = "../../crates/wse-client", features = ["bridge"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
