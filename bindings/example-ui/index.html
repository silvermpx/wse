<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- csp -->
    <title>WSE</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #5b6577;
        --line: #dde1e8;
        --accent: #2b5d8c;
        --ok: #1f7a4d;
        --warn: #9a6b00;
        --bad: #a63a3a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15181e;
          --card: #1d2129;
          --text: #e7eaf0;
          --muted: #a1a9b8;
          --line: #2e3440;
          --accent: #7fb0e0;
          --ok: #5fc790;
          --warn: #e0b04f;
          --bad: #e07a7a;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
      h1 { font-size: 17px; margin: 0; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 8px; }
      h3 { font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
      p { margin: 0 0 8px; }
      .note { color: var(--muted); }
      .note:empty { display: none; }
      .paused { color: var(--warn); }
      .state { font-weight: 600; }
      .state[data-state='connected'] { color: var(--ok); }
      .state[data-state='connecting'], .state[data-state='reconnecting'] { color: var(--warn); }
      .state[data-state='error'], .state[data-state='disconnected'] { color: var(--bad); }
      .tick { font-size: 22px; font-variant-numeric: tabular-nums; }
      form { display: flex; gap: 8px; margin-bottom: 8px; }
      input { flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
      button { padding: 6px 12px; border: 1px solid var(--accent); border-radius: 6px; background: transparent; color: var(--accent); font: inherit; cursor: pointer; }
      button:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
      button.language { border-color: var(--line); color: var(--muted); }
      ul.replies { margin: 0; padding-left: 18px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script src="page.js"></script>
  </body>
</html>
