name: wse_client
description: The WSE client for Dart and Flutter, on the Rust client through flutter_rust_bridge.
version: 3.1.0
homepage: https://github.com/silvermpx/wse
publish_to: none

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  # hooks 2.0 for Flutter 3.38 to 3.44 (meta 1.17 and 1.18), 2.2 from 3.47 on.
  hooks: ">=2.0.2 <3.0.0"
  code_assets: ">=1.2.1 <3.0.0"
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

# Android: a plugin that sets up Android's certificate verifier as the app
# starts. Elsewhere there is nothing to set up.
flutter:
  plugin:
    platforms:
      android:
        package: dev.wse.flutter
        pluginClass: WseClientPlugin
      ios:
        dartPluginClass: WseClientPlugin
      macos:
        dartPluginClass: WseClientPlugin
      linux:
        dartPluginClass: WseClientPlugin
      windows:
        dartPluginClass: WseClientPlugin
