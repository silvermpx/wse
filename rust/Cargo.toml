[package]
name = "wse-accel"
version = "3.0.0"
edition = "2024"
license = "MIT"
# try_update on the atomics is stable since 1.95.
rust-version = "1.95"

[lib]
name = "_wse_accel"
crate-type = ["cdylib"]

[dependencies]
# No `extension-module` feature (deprecated since PyO3 0.26): maturin sets
# PYO3_BUILD_EXTENSION_MODULE for wheel builds, and without the feature
# `cargo test` links libpython, so the Rust unit tests can run.
pyo3 = { version = "0.30", features = ["abi3-py312"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
rmp-serde = "1.3.1"
rmpv = "1.3.1"
hex = "0.4"
ahash = "0.8.12"
dashmap = "6"
# The crypto library (see [features] and src/crypto.rs) is the only one in the
# build: TLS, JWT, E2E and the Python helpers all use it.
aws-lc-rs = { version = "1.19", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"] }
uuid = { version = "1.29.2", features = ["v7"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
crossbeam-channel = "0.5"
tokio-util = { version = "0.7", features = ["rt"] }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"
mimalloc = "0.1"
# No default features: the crypto provider comes from the chosen library.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"] }
rustls-pki-types = "1"
zstd = "0.14"
parking_lot = "0.13"
indexmap = "2"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
arc-swap = "1"

# musl (Alpine) loads the extension with dlopen, where mimalloc's default
# initial-exec TLS model fails to resolve ("initial-exec TLS resolves to
# dynamic definition"): the module would not import.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", features = ["local_dynamic_tls"] }

[features]
default = ["aws-lc"]
# The crypto library behind cluster TLS, JWT, E2E encryption and the Python
# helpers. aws-lc: aws-lc-rs (the published wheels). fips: aws-lc-rs built from
# its FIPS 140-3 validated module; building it needs CMake and Go.
aws-lc = ["dep:aws-lc-rs", "rustls/aws_lc_rs", "rustls/prefer-post-quantum", "jsonwebtoken/aws_lc_rs"]
fips = ["aws-lc", "aws-lc-rs/fips", "rustls/fips"]

[dev-dependencies]
rcgen = "0.14"
# Property tests: parsers and buffers fed thousands of random inputs per run.
proptest = "1.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
