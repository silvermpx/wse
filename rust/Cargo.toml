[package]
name = "wse-accel"
version = "2.5.1"
edition = "2024"
# try_update on the atomics is stable since 1.95.
rust-version = "1.95"

[lib]
name = "_wse_accel"
crate-type = ["cdylib"]

[dependencies]
# No `extension-module` feature (deprecated since PyO3 0.26): maturin sets
# PYO3_BUILD_EXTENSION_MODULE for wheel builds, and without the feature
# `cargo test` links libpython, so the Rust unit tests can run.
pyo3 = { version = "0.30", features = ["abi3-py312"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
rmp-serde = "1.3.1"
rmpv = "1.3.1"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
ahash = "0.8.12"
dashmap = "6"
# zeroize: AES key schedules are wiped when a cipher is dropped.
aes-gcm = { version = "0.11", features = ["getrandom", "zeroize"] }
# Key generation uses p256's own getrandom-backed `Generate` (default `std` feature).
p256 = { version = "0.14", features = ["ecdh"] }
# aws_lc_rs: the same crypto library rustls already uses; the rust_crypto
# backend pulled a second, older RustCrypto stack and the rsa crate.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
hkdf = "0.13"
uuid = { version = "1.29.2", features = ["v7"] }
base64 = "0.23"
chrono = { version = "0.4.45", features = ["serde"] }
regex = "1.13.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"] }
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
crossbeam-channel = "0.5"
tokio-util = { version = "0.7", features = ["rt"] }
socket2 = { version = "0.6", features = ["all"] }
bytes = "1"
mimalloc = "0.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = true }
rustls-pki-types = "1"
zstd = "0.14"
parking_lot = "0.13"
indexmap = "2"
zeroize = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
arc-swap = "1"

[dev-dependencies]
rcgen = "0.14"
# Property tests: parsers and buffers fed thousands of random inputs per run.
proptest = "1.12"

[profile.release]
lto = true
codegen-units = 1
strip = true
