[build-system]
# 1.16: free-threaded (3.14t / 3.15t) and Python 3.15 extension naming fixes.
requires = ["maturin>=1.16,<2.0"]
build-backend = "maturin"

[project]
name = "wse-server"
version = "3.0.0"
description = "Rust-powered WebSocket engine for Python. Up to 5M fan-out del/s. Zero-GIL JWT."
readme = "README.md"
# PEP 639: an SPDX expression (core metadata License-Expression). The table
# form next to license-files is what PEP 639 tells build tools to reject, and
# the License :: classifier is superseded by the expression.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    { name = "silvermpx" },
]
keywords = [
    "websocket",
    "engine",
    "real-time",
    "pubsub",
    "cluster",
    "encrypted",
    "rust",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Programming Language :: Rust",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
msgpack = [
    "msgpack>=1.0",
]
prometheus = [
    "prometheus-client>=0.21",
]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.5",
    "pytest-cov>=7.1",
    "httpx>=0.28.1",
    "uvicorn>=0.54",
    "websockets>=17.4",
    "ruff>=0.17.5",
    "mypy>=2.4",
    "maturin>=1.16",
]

[project.urls]
Homepage = "https://github.com/silvermpx/wse"
Documentation = "https://github.com/silvermpx/wse/tree/main/docs"
Repository = "https://github.com/silvermpx/wse"
Issues = "https://github.com/silvermpx/wse/issues"
Changelog = "https://github.com/silvermpx/wse/releases"

[tool.maturin]
features = ["pyo3/abi3-py312"]
module-name = "wse_server._wse_accel"
manifest-path = "rust/Cargo.toml"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
