[package]
name = "wse"
description = "WebSocket engine: fan-out on every core, topics with recovery, presence, a native cluster protocol, JWT, end-to-end encryption and signed messages."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["websocket", "pubsub", "realtime", "tokio", "server"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[dependencies]
# The protocol, both sides of it: the crypto, end-to-end sessions and signed
# messages (`wse::protocol`).
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4"
base64 = "0.23"
zeroize = "1"
# std::time outside the browser, the browser's clock in it.
web-time = "1"

# The server (feature `server`, the default).
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"], optional = true }
rmpv = { version = "1.3.1", optional = true }
ahash = { version = "0.8.12", optional = true }
dashmap = { version = "6", optional = true }
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem"], optional = true }
uuid = { version = "1.29.2", features = ["v7"], optional = true }
chrono = { version = "0.4.45", features = ["serde"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "net", "time", "io-util"], optional = true }
tokio-tungstenite = { version = "0.30.0", optional = true }
futures-util = { version = "0.3.34", optional = true }
crossbeam-channel = { version = "0.5", optional = true }
tokio-util = { version = "0.7", features = ["rt"], optional = true }
socket2 = { version = "0.6", features = ["all"], optional = true }
bytes = { version = "1", optional = true }
# No default features: the crypto provider comes from the chosen library.
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
rustls-pki-types = { version = "1", optional = true }
zstd = { version = "0.14", optional = true }
parking_lot = { version = "0.13", optional = true }
tracing = { version = "0.1", optional = true }
arc-swap = { version = "1", optional = true }

# The Python module (feature `python`, built by crates/wse-py). No
# `extension-module` feature (deprecated since PyO3 0.26): maturin sets
# PYO3_BUILD_EXTENSION_MODULE for wheel builds.
pyo3 = { version = "0.30", features = ["abi3-py312"], optional = true }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"], optional = true }
# The Python package's event filters.
regex = { version = "1.13.1", optional = true }
indexmap = { version = "2", optional = true }

# The crypto: aws-lc-rs everywhere it builds...
[target.'cfg(not(any(target_arch = "wasm32", wse_rustcrypto)))'.dependencies]
aws-lc-rs = "1.19"

# ...and the protocol's functions in pure Rust in the browser (or with
# RUSTFLAGS="--cfg wse_rustcrypto", to test them natively).
[target.'cfg(any(target_arch = "wasm32", wse_rustcrypto))'.dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "getrandom", "alloc"] }
# Key schedules and MAC states wiped when dropped, as aws-lc-rs does.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = "0.11"
getrandom = "0.4"

# The browser's random generator (crypto.getRandomValues).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
default = ["server"]
# The server. Without it the crate is the protocol alone (`wse::protocol`),
# which the Rust client builds on, in the browser too.
server = [
    "aws-lc",
    "dep:flate2",
    "dep:rmpv",
    "dep:ahash",
    "dep:dashmap",
    "dep:jsonwebtoken",
    "dep:uuid",
    "dep:chrono",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:crossbeam-channel",
    "dep:tokio-util",
    "dep:socket2",
    "dep:bytes",
    "dep:tokio-rustls",
    "dep:rustls",
    "dep:rustls-pki-types",
    "dep:zstd",
    "dep:parking_lot",
    "dep:tracing",
    "dep:arc-swap",
]
# The Python module: the wse-server package's extension (crates/wse-py).
python = ["server", "dep:pyo3", "dep:tracing-subscriber", "dep:regex", "dep:indexmap"]
# The crypto library behind cluster TLS and JWT; the protocol's is aws-lc-rs
# in any case. aws-lc: aws-lc-rs (the published wheels). fips: aws-lc-rs
# built from its FIPS 140-3 validated module; building it needs CMake and Go.
aws-lc = ["rustls?/aws_lc_rs", "rustls?/prefer-post-quantum", "jsonwebtoken?/aws_lc_rs"]
fips = ["aws-lc", "aws-lc-rs/fips", "rustls?/fips"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wse_rustcrypto)"] }

# The server's own tests and example.
[[test]]
name = "server"
required-features = ["server"]

[[example]]
name = "chat"
required-features = ["server"]

[package.metadata.docs.rs]
# The crypto library's own build is the slow part: one target is enough.
targets = ["x86_64-unknown-linux-gnu"]

# The server's tests, which run natively.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rcgen = "0.14"
# The examples wait for Ctrl+C.
tokio = { version = "1.54.1", features = ["signal"] }
# Property tests: parsers and buffers fed thousands of random inputs per run.
proptest = "1.12"
