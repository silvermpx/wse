[package]
name = "wse-protocol"
description = "The pieces of the WSE protocol its server and clients share: the crypto, end-to-end sessions and signed messages."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["websocket", "e2e", "encryption", "signatures"]
categories = ["cryptography", "network-programming"]

[dependencies]
zeroize = "1"
base64 = "0.23"
hex = "0.4"
serde = "1.0.229"
serde_json = "1.0.154"
# std::time outside the browser, the browser's clock in it.
web-time = "1"

# aws-lc-rs everywhere it builds...
[target.'cfg(not(any(target_arch = "wasm32", wse_rustcrypto)))'.dependencies]
aws-lc-rs = "1.19"

# ...and the same functions in pure Rust in the browser (or with
# RUSTFLAGS="--cfg wse_rustcrypto", to test them natively).
[target.'cfg(any(target_arch = "wasm32", wse_rustcrypto))'.dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "pkcs8", "getrandom", "alloc"] }
# Key schedules and MAC states wiped when dropped, as aws-lc-rs does.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = "0.11"
getrandom = "0.4"

# The browser's random generator (crypto.getRandomValues).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[features]
# aws-lc-rs built from its FIPS 140-3 validated module (needs CMake and Go).
fips = ["aws-lc-rs/fips"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(wse_rustcrypto)"] }

[package.metadata.docs.rs]
# The crypto library's own build is the slow part: one target is enough.
targets = ["x86_64-unknown-linux-gnu"]
