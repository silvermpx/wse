[package]
name = "wse-protocol"
description = "The pieces of the WSE protocol its server and clients share: the crypto, end-to-end sessions and signed messages."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["websocket", "e2e", "encryption", "signatures"]
categories = ["cryptography", "network-programming"]

[dependencies]
aws-lc-rs = "1.19"
zeroize = "1"
base64 = "0.23"
hex = "0.4"
serde = "1.0.229"
serde_json = "1.0.154"

[features]
# aws-lc-rs built from its FIPS 140-3 validated module (needs CMake and Go).
fips = ["aws-lc-rs/fips"]
