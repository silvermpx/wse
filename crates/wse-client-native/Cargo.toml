[package]
name = "wse-client-native"
description = "The WSE Rust client for mobile bindings (Swift, Kotlin, Dart): plain types, one shared runtime, events read in bounded batches, cancellable calls."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["websocket", "pubsub", "realtime", "mobile", "ffi"]
categories = ["network-programming", "api-bindings"]

[dependencies]
wse-client = { version = "=3.0.1", path = "../wse-client" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

[dev-dependencies]
wse = { workspace = true, features = ["server"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }

