[package]
name = "wse-client"
description = "Rust client for WSE servers, natively and in the browser: topics with message recovery, reconnects, MessagePack, end-to-end encryption and signed messages."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["websocket", "pubsub", "realtime", "tokio", "client"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
bytes = "1"
bytestring = "1"
# The signing key's bytes, wiped once read.
zeroize = { version = "1", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
foldhash = "0.2"
memchr = "2"
tracing = "0.1"
# std::time outside the browser, the browser's clock in it.
web-time = "1"
# End-to-end encryption and signing: the server's own code (`wse::protocol`,
# the crate without its server), on aws-lc-rs (in the browser on RustCrypto).
wse = { workspace = true, optional = true }
base64 = { version = "0.23", optional = true }

# Outside the browser: tokio, tokio-tungstenite, rustls for wss://.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
fastrand = "2"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
# The cancel tokens of the `native` module.
tokio-util = { version = "0.7", default-features = false, optional = true }
webpki-roots = { version = "1", optional = true }
# The system's certificate verifier, for the `native` module.
rustls-platform-verifier = { version = "0.7.1", optional = true }

# Android's certificate verifier is reached through the JVM.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22.4", default-features = false, optional = true }

# The name of the lock every client takes of an outbox's file on Linux.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
sha2 = "0.11"

# In the browser: its WebSocket and timers.
[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["sync", "macros"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "BinaryType", "CloseEvent", "DomException", "DomStringList", "Event", "IdbDatabase", "IdbFactory",
    "IdbKeyRange", "IdbObjectStore", "IdbObjectStoreParameters", "IdbOpenDbRequest", "IdbRequest",
    "IdbTransaction", "IdbTransactionMode", "MessageEvent", "WebSocket",
] }
gloo-timers = { version = "0.3", features = ["futures"] }

[features]
default = ["aws-lc"]
# wss:// with rustls and the Mozilla root certificates, end-to-end encryption
# and signed messages, on aws-lc-rs. In the browser: end-to-end encryption
# and signed messages on RustCrypto (the browser does TLS).
aws-lc = [
    "dep:wse",
    "dep:zeroize",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:base64",
    "rustls/aws_lc_rs",
    "rustls/prefer-post-quantum",
    "tokio-tungstenite/rustls-tls-webpki-roots",
]
# aws-lc-rs built from its FIPS 140-3 validated module (needs CMake and Go).
fips = ["aws-lc", "wse/fips", "rustls/fips"]
# The `bridge` module: one connection for every window of an application
# (Tauri's webviews), the owner of the TypeScript client's window bridge.
bridge = ["aws-lc"]
# The `native` module, for the Swift, Kotlin and Dart packages: plain types,
# one shared runtime, events read in bounded batches. Not in the browser.
native = [
    "aws-lc",
    "dep:tokio-util",
    "tokio/rt-multi-thread",
    "dep:rustls-platform-verifier",
    "dep:jni",
]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# The server, published before this crate: its tests and examples build
# from the package.
wse = { workspace = true, features = ["server"] }
# The chat example reads the terminal.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
# The example server's wss:// door: a certificate authority of its own.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs", "tls12"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
fastrand = "2"

[package.metadata.docs.rs]
# The crypto library's own build is the slow part: one target is enough.
targets = ["x86_64-unknown-linux-gnu"]

[[test]]
name = "bridge"
required-features = ["bridge"]

[[test]]
name = "native"
required-features = ["native"]

[[test]]
name = "system_trust"
required-features = ["native"]
