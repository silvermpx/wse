[package]
name = "wse-client"
description = "Client for WSE servers: topics with recovery, reconnects, msgpack, end-to-end encryption and signed messages."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["websocket", "pubsub", "realtime", "tokio", "client"]
categories = ["network-programming", "web-programming::websocket", "asynchronous"]

[dependencies]
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
bytes = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
rmp = "0.8.15"
rmp-serde = "1.3.1"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
ahash = "0.8.12"
fastrand = "2"
tracing = "0.1"
# TLS (wss://), end-to-end encryption and signing: one crypto library, as in
# the server, and the server's own E2E and signing code.
wse-protocol = { version = "=3.0.0", path = "../wse-protocol", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "logging"], optional = true }
webpki-roots = { version = "1", optional = true }
base64 = { version = "0.23", optional = true }

[features]
default = ["aws-lc"]
# wss:// with rustls and the Mozilla root certificates, end-to-end encryption
# and signed messages, on aws-lc-rs.
aws-lc = [
    "dep:wse-protocol",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:base64",
    "rustls/aws_lc_rs",
    "rustls/prefer-post-quantum",
    "tokio-tungstenite/__rustls-tls",
]
# aws-lc-rs built from its FIPS 140-3 validated module (needs CMake and Go).
fips = ["aws-lc", "wse-protocol/fips", "rustls/fips"]

[dev-dependencies]
wse = { path = "../wse" }
# The chat example reads the terminal.
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util"] }
