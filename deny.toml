# cargo-deny: what the Rust dependency trees may contain. CI runs
# `cargo deny check` for the extension (rust/) and the repository tools
# (xtask/), and a weekly run catches advisories published in between.

[graph]
all-features = true

[advisories]
version = 2
# A yanked crate in the lock file fails like an advisory.
yanked = "deny"
# Each ignored advisory needs a reason and the condition that removes it.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# One policy covers three trees; a license only some of them use is fine.
unused-allowed-license = "allow"
# Permissive licenses compatible with shipping MIT wheels.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]

# The FIPS 140-3 module carries the OpenSSL license; it is built only with the
# `fips` feature, and only that crate may use the license.
[[licenses.exceptions]]
crate = "aws-lc-fips-sys"
allow = ["OpenSSL"]

[bans]
# Two versions of one crate are reported, not refused: some come in through
# upstream crates and resolve as those update.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
