# The WSE workspace: the server (crates/wse, on crates.io as `wse`), the Rust
# client (crates/wse-client, `wse-client`) and the Python extension built from
# the server (crates/wse-py, the `wse-server` package).
[workspace]
members = ["crates/wse", "crates/wse-client", "crates/wse-py"]
# Their own lock files and tools: run on their own.
exclude = ["benchmarks/rust-bench", "xtask"]
resolver = "3"

[workspace.package]
version = "3.0.1"
edition = "2024"
license = "MIT"
# try_update on the atomics is stable since 1.95.
rust-version = "1.95"
repository = "https://github.com/silvermpx/wse"

# The client depends on the server's crate at exactly the release's version:
# for the protocol (no default features), and in its tests and examples for
# the server itself.
[workspace.dependencies]
wse = { version = "=3.0.1", path = "crates/wse", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true
